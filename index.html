<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;line-height:1.5;color:#333;background:#f0f2f5;padding-top:0;padding-bottom:80px}
a{text-decoration:none;color:inherit}
.ld{position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
.ld.off{display:none}
.ldb{display:flex;gap:4px;margin-bottom:16px}
.ldb span{width:6px;height:40px;background:#ECC400;border-radius:3px;animation:lb .6s ease-in-out infinite alternate}
.ldb span:nth-child(2){animation-delay:.1s}
.ldb span:nth-child(3){animation-delay:.2s}
@keyframes lb{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.ldt{color:#fff;font-size:.9rem;text-align:center}
.hd{background:var(--primary-color,#1a1a2e);position:sticky;top:0;z-index:100}
.hd nav{display:flex;align-items:center;gap:12px;width:100%;max-width:1600px;margin:0 auto;padding:8px 14px}
.lg{font-size:1.15rem;font-weight:800;color:var(--accent-color,#ECC400);display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap}
.lg i{font-size:1.25rem}
.nav-links{display:flex;gap:4px;list-style:none;flex:1 1 auto;min-width:0;overflow-x:auto}
.nav-links a{display:flex;align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap;padding:9px 14px;border-radius:20px;color:rgba(255,255,255,.92);font-size:.94rem;font-weight:700;text-decoration:none}
.nav-links a i{font-size:.92rem;opacity:.9}
.nav-links a:hover{background:rgba(255,255,255,.14);color:#fff}
.nav-links a.ativo{background:var(--accent-color,#ECC400);color:var(--primary-color,#1a1a2e)}
.ha{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.bs{padding:9px 14px;background:var(--accent-color,#ECC400);color:#1a1a2e;border-radius:20px;font-weight:800;font-size:.82rem;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:7px;min-height:42px;white-space:nowrap}
.bs:hover{filter:brightness(1.08)}
.ci{position:relative;cursor:pointer;font-size:1.4rem;color:#fff;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14)}
.cb{position:absolute;top:-2px;right:-2px;background:#e53935;color:#fff;font-size:.68rem;font-weight:800;padding:2px 6px;border-radius:10px;min-width:20px;text-align:center}
.sw{background:#fff;padding:10px 14px;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:60px;z-index:99}
.si{max-width:1600px;margin:0 auto}
.sf{position:relative}
.sf i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6b7280}
.sf input{width:100%;padding:11px 14px 11px 40px;border:2px solid #e0e0e0;border-radius:25px;font-size:1rem;outline:none}
@media(max-width:640px){.bs-tx{display:none}.bs{padding:0;width:44px;justify-content:center}.lg span{display:none}.lg{font-size:0}.lg i{font-size:1.5rem}}
</style>
</head>

<script>
(function(){
  var atual = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  document.querySelectorAll('.nav-links a').forEach(function(a){
    var alvo = (a.getAttribute('href') || '').split('/').pop().toLowerCase();
