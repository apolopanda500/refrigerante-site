<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Convenção - Delivery OFICIAL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#ECC400;--primary-dark:#c4a600;--dark:#1a1a2e;--text:#333;--light:#f5f5f5;--white:#fff;--red:#e53935;--green:#43a047;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:12px}
body{font-family:'Poppins',sans-serif;color:var(--text);background:#f0f2f5;min-height:100vh;padding-bottom:80px}
a{text-decoration:none;color:inherit}

/* LOADING */
.loader-container{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
.loader-container.hide{opacity:0;pointer-events:none}
.loader{display:flex;gap:4px;margin-bottom:16px}
.loader .bar{width:6px;height:40px;background:var(--primary);border-radius:3px;animation:barBounce .6s ease-in-out infinite alternate}
.loader .bar:nth-child(2){animation-delay:.1s}.loader .bar:nth-child(3){animation-delay:.2s}
.loader .bar:nth-child(4){animation-delay:.3s}.loader .bar:nth-child(5){animation-delay:.4s}.loader .bar:nth-child(6){animation-delay:.5s}
@keyframes barBounce{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.loader-msg{color:#fff;font-size:.9rem;text-align:center;line-height:1.6}

/* HEADER */
.main-header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.3)}
.main-header nav{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:12px 20px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:700;color:var(--primary)}
.logo i{font-size:1.5rem}
.nav-links{display:flex;gap:20px;list-style:none}
.nav-links a{color:#ccc;font-size:.85rem;font-weight:500;transition:color .3s;display:flex;align-items:center;gap:5px}
.nav-links a:hover{color:var(--primary)}
.header-actions{display:flex;align-items:center;gap:14px}
.share-btn{display:flex;align-items:center;gap:6px;padding:7px 16px;background:var(--primary);color:var(--dark);border-radius:20px;font-weight:600;font-size:.8rem;cursor:pointer;border:none}
.cart-icon{position:relative;cursor:pointer;font-size:1.4rem;color:#fff}
.cart-count{position:absolute;top:-8px;right:-10px;background:var(--red);color:#fff;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
/* SEARCH */
.search-bar{background:#fff;padding:12px 20px;box-shadow:var(--shadow);position:sticky;top:56px;z-index:99}
.search-bar .container{max-width:1200px;margin:0 auto;display:flex;gap:10px;align-items:center}
.search-input-wrap{flex:1;position:relative}
.search-input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#999}
.search-input{width:100%;padding:10px 14px 10px 40px;border:2px solid #e0e0e0;border-radius:25px;font-size:.9rem;font-family:inherit;outline:none}
.search-input:focus{border-color:var(--primary)}

/* TABS */
.grupos-tabs{background:#fff;border-bottom:2px solid #eee;position:sticky;top:110px;z-index:98;overflow-x:auto;scrollbar-width:none}
.grupos-tabs::-webkit-scrollbar{display:none}
.tabs-inner{display:flex;max-width:1200px;margin:0 auto;padding:0 10px;min-width:max-content}
.tab-item{padding:12px 18px;font-size:.82rem;font-weight:600;color:#666;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px}
.tab-item:hover{background:#f8f8f8}
.tab-item.active{color:var(--primary-dark);border-bottom-color:var(--primary);background:#fffde7}

/* MAIN */
.main-content{max-width:1200px;margin:0 auto;padding:16px 20px}

/* ACCORDION */
.grupo-section{margin-bottom:8px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.grupo-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;user-select:none}
.grupo-header:hover{background:#fafafa}
.grupo-header-left{display:flex;align-items:center;gap:12px}
.grupo-header-left i{font-size:1.3rem;color:var(--primary-dark);width:32px;text-align:center}
.grupo-nome{font-size:1.05rem;font-weight:700;color:var(--dark)}
.grupo-count{font-size:.75rem;background:var(--primary);color:var(--dark);padding:2px 8px;border-radius:10px;font-weight:600}
.grupo-chevron{font-size:.9rem;color:#999;transition:transform .3s}
.grupo-section.open .grupo-chevron{transform:rotate(180deg)}
.grupo-body{display:none;padding:0 16px 16px}
.grupo-section.open .grupo-body{display:block}

/* GRID */
.produtos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.produtos-grid{grid-template-columns:repeat(2,1fr)}}
/* CARD PRODUTO */
.produto-card{background:#fff;border:1px solid #eee;border-radius:10px;overflow:hidden;cursor:pointer;transition:all .3s;display:flex;flex-direction:column}
.produto-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.12);transform:translateY(-2px)}
.produto-card-header{padding:10px 14px 6px;font-weight:600;font-size:.88rem;color:var(--dark);line-height:1.3}
.produto-img-wrap{width:100%;aspect-ratio:1;background:#f8f8f8;display:flex;align-items:center;justify-content:center;padding:8px}
.produto-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.produto-dados{padding:8px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.produto-desc{font-size:.78rem;color:#888;line-height:1.4}
.produto-preco{font-size:1.1rem;font-weight:700;color:var(--green);margin-top:auto}

/* QUANTITY */
.qtd-row{display:flex;align-items:center;gap:8px;padding:8px 14px 12px}
.qtd-control{display:flex;align-items:center;border:2px solid #e0e0e0;border-radius:8px;overflow:hidden}
.qtd-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#f5f5f5;border:none;font-size:1rem;cursor:pointer}
.qtd-btn:hover{background:var(--primary);color:#fff}
.qtd-valor{width:36px;text-align:center;font-weight:700;font-size:.95rem;height:34px;line-height:34px;border-left:2px solid #e0e0e0;border-right:2px solid #e0e0e0}
.btn-add{flex:1;height:34px;background:var(--primary);color:var(--dark);border:none;border-radius:8px;font-weight:700;font-size:.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-add:hover{background:var(--primary-dark);color:#fff}
.btn-add.added{background:var(--green);color:#fff}

/* FOOTER */
.main-footer{background:var(--dark);color:#ccc;text-align:center;padding:20px;font-size:.85rem;margin-top:40px}
.main-footer a{color:var(--primary);font-weight:600}

/* FAB */
.fab-cart{position:fixed;bottom:20px;right:20px;width:60px;height:60px;background:var(--primary);color:var(--dark);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.3);cursor:pointer;z-index:200;border:none}
.fab-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:.65rem;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:1}
.modal-close{background:none;border:none;font-size:1.3rem;color:#999;cursor:pointer}
.modal-body{padding:16px 20px}
.modal-footer{padding:16px 20px;border-top:1px solid #eee;position:sticky;bottom:0;background:#fff}
.btn-confirm{width:100%;padding:14px;background:var(--primary);color:var(--dark);border:none;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer}
.btn-confirm:hover{background:var(--primary-dark);color:#fff}
.modal-produto-img{width:120px;height:120px;object-fit:contain;margin:0 auto 12px;display:block}
.modal-produto-nome{font-weight:700;text-align:center;margin-bottom:4px}
.modal-produto-preco{font-size:1.2rem;font-weight:700;color:var(--green);text-align:center;margin-bottom:16px}

@media(max-width:768px){
  .nav-links{display:none}
  .main-header nav{padding:10px 16px}
  .search-bar{top:52px}
  .grupos-tabs{top:104px}
}

  {cat:"refrescos",nome:"Abacaxi com Hortelã 2L",desc:"Sabor abacaxi com hortelã",preco:"R$ 7,00",img:"img/abacaxi.jpg"},
  {cat:"refrescos",nome:"Abacaxi com Hortelã 600ml",desc:"Sabor abacaxi com hortelã",preco:"R$ 5,00",img:"img/abacaxi600ml.jpg"},

<script>
function renderTabs() {
  var h = "";
  CATEGORIAS.forEach(function(c, i) {
    var count = PRODUTOS.filter(function(p){return p.cat===c.id}).length;
    h += '<div class="tab-item'+(i===0?' active':'')+'" data-grupo="'+c.id+'" onclick="scrollToGrupo(\''+c.id+'\')">';
    h += '<i class="fa '+c.icon+'"></i> '+c.nome+' <span style="font-size:.7rem;background:#eee;padding:1px 6px;border-radius:8px">'+count+'</span></div>';
  });
  document.getElementById("tabsInner").innerHTML = h;
}

function renderProdutos() {
  var h = "";
  CATEGORIAS.forEach(function(c) {
    var prods = PRODUTOS.filter(function(p){return p.cat===c.id});
    if (!prods.length) return;
    h += '<div class="grupo-section open" id="grupo-'+c.id+'" data-grupo-id="'+c.id+'">';
    h += '<div class="grupo-header" onclick="toggleGrupo(\''+c.id+'\')">';
    h += '<div class="grupo-header-left"><i class="fa '+c.icon+'"></i><span class="grupo-nome">'+c.nome+'</span><span class="grupo-count">'+prods.length+'</span></div>';
    h += '<i class="fa fa-chevron-down grupo-chevron"></i></div>';
    h += '<div class="grupo-body"><div class="produtos-grid">';
    prods.forEach(function(p, i) {
      var pid = c.id+"_"+i;
      h += '<div class="produto-card" data-item-desc="'+(p.nome+" "+p.desc).toLowerCase()+'" data-produto-id="'+pid+'">';
      h += '<div class="produto-card-header">'+p.nome+'</div>';
      h += '<div class="produto-img-wrap"><img class="produto-img" src="'+p.img+'" alt="'+p.nome+'" loading="lazy" onerror="this.style.display=\'none\'"></div>';
      h += '<div class="produto-dados"><span class="produto-desc">'+p.desc+'</span><span class="produto-preco">'+p.preco+'</span></div>';
      h += '<div class="qtd-row"><div class="qtd-control"><button type="button" class="qtd-btn" onclick="event.stopPropagation();mudarQtd(this,-1)">&minus;</button><span class="qtd-valor">0</span><button type="button" class="qtd-btn" onclick="event.stopPropagation();mudarQtd(this,1)">+</button></div><button class="btn-add" onclick="event.stopPropagation();adicionarAoCarrinho(this)"><i class="fa fa-cart-plus"></i> Adicionar</button></div></div>';
    });
    h += '</div></div></div>';
  });
  document.getElementById("mainContent").innerHTML = h;
}

function toggleGrupo(id) {
  var el = document.getElementById("grupo-"+id);
  if (el) el.classList.toggle("open");
}

function scrollToGrupo(id) {
  var el = document.getElementById("grupo-"+id);
  if (el) {
    window.scrollTo({top:el.getBoundingClientRect().top + window.pageYOffset - 170, behavior:"smooth"});
    document.querySelectorAll(".tab-item").forEach(function(t){t.classList.remove("active")});
    var tab = document.querySelector('.tab-item[data-grupo="'+id+'"]');
    if (tab) { tab.classList.add("active"); tab.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}); }
  }
}

function filtraProdutos(txt) {
  var busca = txt.toLowerCase().trim();
  document.querySelectorAll(".produto-card").forEach(function(card) {
    card.style.display = (!busca || (card.getAttribute("data-item-desc")||"").indexOf(busca)>=0) ? "" : "none";
  });
  document.querySelectorAll(".grupo-section").forEach(function(g) {
    var ok = false;
    g.querySelectorAll(".produto-card").forEach(function(c){if(c.style.display!=="none")ok=true});
    g.style.display = ok ? "" : "none";
    if (busca && ok) g.classList.add("open");
  });
}

function mudarQtd(btn, delta) {
  var span = btn.closest(".qtd-row").querySelector(".qtd-valor");
  span.textContent = Math.max(0, (parseInt(span.textContent)||0) + delta);
}

function adicionarAoCarrinho(btn) {
  var card = btn.closest(".produto-card");
  var qtd = parseInt(card.querySelector(".qtd-valor").textContent)||0;
  if (qtd<=0) { alert("Use os botões + e − para escolher a quantidade."); return; }
  var parts = card.getAttribute("data-produto-id").split("_");
  var prod = PRODUTOS.filter(function(p){return p.cat===parts[0]})[parseInt(parts[1])];
  if (!prod) return;
  if (typeof cart!=="undefined") {
    cart.push({name:prod.nome,price:prod.preco,priceNum:parsePreco(prod.preco),qty:qtd});
    if (typeof saveCart==="function") saveCart();
  }
  card.querySelector(".qtd-valor").textContent="0";
  btn.classList.add("added"); btn.innerHTML='<i class="fa fa-check"></i> Adicionado!';
  setTimeout(function(){btn.classList.remove("added");btn.innerHTML='<i class="fa fa-cart-plus"></i> Adicionar'},1500);
  updateCartCount();
}

function updateCartCount() {
  try {
    var items = JSON.parse(localStorage.getItem("refrigeranteCart")||"[]");
    var t = items.reduce(function(s,i){return s+(i.qty||0)},0);
    var e1=document.getElementById("cartCount"),e2=document.getElementById("fabBadge");
    if(e1)e1.textContent=t; if(e2)e2.textContent=t;
  } catch(e) {}
}

document.addEventListener("DOMContentLoaded", function() {
  renderTabs(); renderProdutos(); updateCartCount();
  setTimeout(function(){var l=document.getElementById("loader");if(l)l.classList.add("hide")},800);
  window.addEventListener("scroll", function() {
    var scroll = window.pageYOffset + 200;
    document.querySelectorAll(".grupo-section").forEach(function(s) {
      if (scroll>=s.offsetTop && scroll<s.offsetTop+s.offsetHeight) {
