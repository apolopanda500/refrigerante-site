<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json?v=20261014o">
<meta name="theme-color" content="#3d4465">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Convenção">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>Pedido Recebido - Refrigerantes Convenção</title>
<link rel="stylesheet" href="style.css?v=20261014o">
<script src="theme.js?v=20261014o"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.page { padding: 110px 0 60px; background: var(--light-bg); min-height: 100vh; }
.sucesso-box { max-width: 640px; margin: 0 auto; }
.sucesso-card { background:#fff; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); padding:36px 28px; text-align:center; }
.sucesso-icone { width:90px; height:90px; border-radius:50%; background:#4CAF50; color:#fff; font-size:2.6rem; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
.sucesso-card h1 { color:#2e7d32; font-size:1.6rem; margin-bottom:6px; }
.pedido-id { font-size:1.1rem; color:#555; margin-bottom:16px; }
.pedido-id b { color:var(--primary-color); font-size:1.3rem; }
.status-linha { margin:18px 0; }
.detalhe { text-align:left; background:#fafafa; border-radius:12px; padding:16px 18px; margin-top:16px; }
.detalhe h3 { color:var(--primary-color); font-size:1rem; margin-bottom:10px; }
.detalhe-linha { display:flex; justify-content:space-between; padding:5px 0; font-size:0.92rem; color:#444; }
.detalhe-linha.total { border-top:1px solid #ddd; margin-top:8px; padding-top:10px; font-weight:bold; font-size:1.1rem; color:var(--primary-color); }
.acoes { display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }
.btn { flex:1; min-width:160px; text-align:center; padding:13px 18px; border:none; border-radius:24px; font-weight:bold; font-size:0.98rem; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primario { background:var(--primary-color); color:#fff; }
.btn-primario:hover { background:#c62828; }
.btn-secundario { background:#fff; color:var(--primary-color); border:2px solid var(--primary-color); }

/* ===== NAVEGACAO HORIZONTAL (igual a home) ===== */
.main-header{background:var(--primary-color,#3d4465)!important;position:sticky;top:0;z-index:100}
.main-header .container{max-width:1600px;width:100%;padding:0 12px}
.main-header nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;min-height:60px}
.main-header .logo{
    display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap;
    font-size:1.1rem;font-weight:800;color:var(--accent-color,#ffb822);
}
.main-header .nav-links{
    display:flex;gap:4px;list-style:none;flex:1 1 auto;min-width:0;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.main-header .nav-links::-webkit-scrollbar{display:none}
.main-header .nav-links a{
    display:flex;align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap;
    padding:9px 14px;border-radius:20px;text-decoration:none;
    color:rgba(255,255,255,.94)!important;font-size:.95rem;font-weight:700;
}
.main-header .nav-links a i{font-size:.92rem;opacity:.9}
.main-header .nav-links a:hover{background:rgba(255,255,255,.15)!important;color:#fff!important}
.main-header .nav-links a.ativo{background:var(--accent-color,#ffb822)!important;color:var(--primary-color,#3d4465)!important}
.main-header .header-actions{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.main-header .cart-icon{
    display:flex;align-items:center;justify-content:center;width:44px;height:44px;
    border-radius:50%;background:rgba(255,255,255,.14);color:#fff!important;font-size:1.15rem;
}
.main-header .cart-count{background:#fc0758;color:#fff;font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:10px}
.main-header .mobile-menu-btn{display:none!important}
[data-theme="dark"] .main-header{background:#232742!important}
[data-theme="dark"] .main-header .nav-links a.ativo{background:#ffb822!important;color:#3d4465!important}
@media(max-width:640px){
    .main-header .logo span{display:none}
    .main-header .logo{font-size:0}
    .main-header .logo i{font-size:1.4rem}
    .main-header .nav-links a{padding:9px 12px;font-size:.9rem}
}
</style>
</head>
<body>
<header class="main-header"><div class="container"><nav>
<div class="logo"><i class="fa fa-leaf"></i><span>Refrigerantes Convenção</span></div>
<span class="mobile-menu-btn"><span></span><span></span><span></span></span>
<ul class="nav-links" id="mainNav"><li><a href="index.html">Produtos</a></li><li><a href="meus-pedidos.html">Meus Pedidos</a></li></ul>
<div class="header-actions"></div>
</nav></div></header>

<section class="page"><div class="container"><div class="sucesso-box">
<div class="sucesso-card">
  <div class="sucesso-icone"><i class="fa fa-check"></i></div>
  <h1>Pedido recebido!</h1>
  <p style="color:#666">Seu pedido foi registrado e está <b>aguardando confirmação</b>.</p>
  <div class="pedido-id">Nº do pedido: <b id="pedidoId">—</b></div>
  <div class="status-linha" id="statusLinha"></div>
  <div class="detalhe" id="detalheBox"></div>
  <div class="acoes">
    <a class="btn btn-primario" href="meus-pedidos.html"><i class="fa fa-list"></i> Meus Pedidos</a>
    <a class="btn btn-secundario" href="index.html"><i class="fa fa-shopping-bag"></i> Continuar comprando</a>
  </div>
</div>
</div></div></section>

<script src="conta.js?v=20261014o"></script>
<script src="firebase-appcheck.js?v=20261014o"></script>
<script src="app-update.js?v=20261014o"></script>
<script src="loja.js?v=20261014o"></script>
<script src="script.js?v=20261014o"></script>
<script>
    // Mobile menu toggle
    const menuBtn = document.querySelector('.mobile-menu-btn');
    const nav = document.getElementById('mainNav');
    
    if (menuBtn && nav) {
        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            nav.classList.toggle('active');
        });
        
        // Close menu when clicking a link
        nav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuBtn.classList.remove('active');
                nav.classList.remove('active');
            });
        });
    }
</script>
<script>
const id = localStorage.getItem("ultimoPedido");
const p = getPedidos().find(x => x.id === id);
if (!p) { window.location.href = "index.html"; }
else {
    document.getElementById("pedidoId").innerText = p.id;
    document.getElementById("statusLinha").innerHTML = statusBadge(p.status);
    let h = '<h3><i class="fa fa-receipt"></i> Resumo do pedido</h3>';
    p.itens.forEach(function(i) {
        h += '<div class="detalhe-linha"><span>' + i.name + ' x' + i.qty + '</span><span>' + formatBRL(i.subtotal) + '</span></div>';
    });
    h += '<div class="detalhe-linha"><span>Subtotal</span><span>' + formatBRL(p.subtotal) + '</span></div>';
    h += '<div class="detalhe-linha"><span>Frete</span><span>' + (p.frete === 0 ? "GRÁTIS" : formatBRL(p.frete)) + '</span></div>';
    h += '<div class="detalhe-linha total"><span>Total</span><span>' + formatBRL(p.total) + '</span></div>';
    h += '</div>';
    h += '<div class="detalhe"><h3><i class="fa fa-map-marker-alt"></i> Entrega</h3>';
    h += '<div class="detalhe-linha"><span>' + p.nome + '</span><span>' + p.tel + '</span></div>';
    h += '<div class="detalhe-linha"><span>' + p.end + (p.comp ? " (" + p.comp + ")" : "") + '</span><span></span></div>';
    h += '<div class="detalhe-linha"><span>Bairro</span><span>' + p.bairro + '</span></div>';
    h += '<div class="detalhe-linha"><span>Pagamento</span><span>' + p.pagamento + '</span></div>';
    if (p.pagamento === "Dinheiro" && p.troco) { h += '<div class="detalhe-linha"><span>Troco para</span><span>' + p.troco + '</span></div>'; }
    h += '<div class="detalhe-linha"><span>Pedido em</span><span>' + dataHora(p.criadoEm) + '</span></div>';
    h += '</div>';
    document.getElementById("detalheBox").innerHTML = h;
}
</script>
<script>
/* destaca a pagina atual no menu */
(function(){
  try{
    var atual = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    document.querySelectorAll('.nav-links a').forEach(function(a){
      var alvo = (a.getAttribute('href') || '').split('/').pop().toLowerCase();
      if (alvo === atual) a.classList.add('ativo');
    });
  }catch(e){}
})();
</script>
</body>
</html>
