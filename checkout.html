<style>
.page{padding:26px 0 80px;background:transparent;min-height:100vh}
.page-head h1{color:var(--primary-color);font-size:1.6rem;display:flex;align-items:center;gap:10px;margin-bottom:20px}
.cart-section{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.07);padding:18px;margin-bottom:18px}
.cart-section h2{color:var(--primary-color);font-size:1.15rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap}
.cart-item:last-child{border-bottom:none}
.cart-item img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#fafafa;display:block}
.ci-info{flex:1;min-width:160px}
.ci-name{font-weight:700;color:var(--text-color);display:block;font-size:0.95rem}
.ci-price{color:#6b7280;font-size:0.9rem}
.ci-qtd{display:inline-flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:22px;padding:5px 8px;background:#fafafa}
.ci-qtd button{width:36px;height:36px;border:none;border-radius:50%;background:var(--primary-color);color:#fff;font-size:1.2rem;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ci-qtd span{min-width:28px;text-align:center;font-weight:bold;font-size:1rem}
.ci-subtotal{font-weight:bold;color:var(--primary-color);min-width:80px;text-align:right;font-size:0.95rem}
.ci-remove{background:none;border:none;color:var(--texto-erro);font-size:1.1rem;cursor:pointer;padding:6px}
.resumo-lateral{position:sticky;top:100px;align-self:start}
.resumo-card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.07);padding:20px;margin-bottom:16px}
.resumo-card h2{color:var(--primary-color);font-size:1.15rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.resumo-item{display:flex;justify-content:space-between;font-size:0.9rem;padding:6px 0;color:#555}
.resumo-row{display:flex;justify-content:space-between;padding:9px 0;font-size:1rem}
.resumo-row.gratis{color:var(--texto-ok);font-weight:bold}
.resumo-row.total{border-top:2px solid #eee;margin-top:10px;padding-top:12px;font-size:1.3rem;font-weight:bold;color:var(--primary-color)}
.btn-finalizar{width:100%;padding:16px;background:#0e6b4f;color:#fff;border:none;border-radius:26px;font-weight:bold;font-size:1.05rem;cursor:pointer;margin-top:14px;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn-finalizar:hover{background:#0a5638}
.btn-finalizar:disabled{background:#999;cursor:not-allowed}
.end-pag-card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.07);padding:22px;margin-bottom:18px}
.end-pag-card h2{color:var(--primary-color);font-size:1.15rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:0.9rem;font-weight:600;color:#444;margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:9px;font-size:0.95rem;font-family:inherit}
.campo input:focus,.campo select:focus{outline:none;border-color:var(--primary-color)}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linha2>.campo:only-child{grid-column:1/-1}
.pag-opcao{display:flex;align-items:center;gap:10px;border:2px solid #eee;border-radius:11px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s}
.pag-opcao:hover{border-color:#ffcdd2}
.pag-opcao.ativa{border-color:var(--primary-color);background:#fff3f3}
.pag-opcao input{width:auto}
.pag-opcao i{font-size:1.3rem;color:var(--primary-color);width:26px;text-align:center}
.pag-opcao span{font-weight:600}
.troco-box{display:none;margin-top:8px;padding:10px;background:#fafafa;border-radius:8px;border:1px solid #eee}
.troco-box label{display:block;font-size:0.88rem;margin-bottom:6px;color:#444;font-weight:600}
.troco-box input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:0.95rem}
.aviso-regiao{font-size:0.88rem;padding:10px 14px;border-radius:8px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px}
.aviso-regiao.pedido{background:#fff3e0;border:1px solid #ff9800;color:#ef6c00}
.aviso-regiao.fechado{background:#ffebee;border:1px solid #f44336;color:var(--texto-erro)}
.aviso-regiao.ok{background:#e8f5e9;border:1px solid #4caf50;color:var(--texto-ok)}
.aviso-regiao i{font-size:1.1rem;margin-top:2px}
#avisoMinimo{display:none;font-size:0.88rem;padding:10px 14px;border-radius:8px;margin-bottom:12px;align-items:flex-start;gap:8px;background:#fff3e0;border:1px solid #ff9800;color:var(--texto-aviso)}
#infoFreteTexto{display:block;font-size:0.85rem;color:var(--text-muted);margin-bottom:10px}
.telegram-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;background:#0088cc;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 4px 12px rgba(0,136,204,0.35);z-index:1000;cursor:pointer;transition:transform .2s,box-shadow .2s}
.telegram-fab:hover{transform:scale(1.08)}
.cart-vazio{text-align:center;padding:40px 20px;color:#6b7280}
.cart-vazio i{font-size:3rem;color:#ddd;margin-bottom:14px}
.cart-vazio p{margin-bottom:16px;font-size:1rem}

[data-theme="dark"] .resumo-card{background:#1c1f33!important;border-color:#353a5c!important}
[data-theme="dark"] .resumo-card h2{color:#ffb822!important}
[data-theme="dark"] .resumo-item{color:#e6e8f2!important}
[data-theme="dark"] .resumo-row{color:#e6e8f2!important}
[data-theme="dark"] .resumo-row.total{color:#ffb822!important;border-top-color:#3d4470!important}
[data-theme="dark"] .btn-finalizar{background:#1e7d46!important}
[data-theme="dark"] .aviso-regiao.pedido{background:#3a2f14!important;border-color:#ffb822!important;color:#ffc75c!important}
[data-theme="dark"] .aviso-regiao.fechado{background:#3a1f22!important;border-color:#f44336!important;color:#ff9a9a!important}
[data-theme="dark"] .aviso-regiao.ok{background:#14331f!important;border-color:#4caf50!important;color:#8fe0a8!important}

</style>
</head>
<body>
<header class="main-header"><div class="container"><nav>
<div class="logo"><i class="fa fa-leaf"></i><span>Refrigerantes Convenção</span></div>
<button class="mobile-menu-btn"><span></span><span></span><span></span></button>
<ul class="nav-links" id="mainNav"><li><a href="index.html"><i class="fa fa-store"></i> Produtos</a></li><li><a href="meus-pedidos.html"><i class="fa fa-history"></i> Hist&oacute;rico</a></li><li><a href="configuracoes.html"><i class="fa fa-cog"></i> Configura&ccedil;&otilde;es</a></li><li><a href="perfil.html"><i class="fa fa-user"></i> Perfil</a></li></ul>
<div class="header-actions"><div class="cart-icon" title="Carrinho"><i class="fa fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span></div></div>
</nav></div></header>
<div class="telegram-fab" title="Falar com o vendedor" onclick="abrirTelegram()"><i class="fa fa-whatsapp"></i></div>

<div class="page"><div class="container">
<div class="page-head"><h1><i class="fa fa-shopping-cart"></i> Finalizar Pedido</h1></div>
<div id="avisoRegiao" class="aviso-regiao" style="display:none"></div>
<div id="avisoMinimo"><span id="avisoMinimoTexto"></span></div>
<div id="infoFreteTexto"></div>
<div class="cart-section" id="cartSection">
  <h2><i class="fa fa-box"></i> Itens do pedido</h2>
  <div id="cartItems"></div>
</div>
<div class="resumo-lateral">
  <div class="resumo-card">
    <h2><i class="fa fa-receipt"></i> Resumo</h2>
    <div id="resumoBox"></div>
    <button class="btn-finalizar" id="btnFinalizar" onclick="finalizarPedido()"><i class="fa fa-credit-card"></i> Finalizar pedido</button>
  </div>
</div>
<div style="clear:both"></div>
<div class="end-pag-card">
  <h2><i class="fa fa-map-marker-alt"></i> Entrega e Pagamento</h2>
  <div class="linha2">
    <div class="campo"><label>Seu bairro</label><input type="text" id="fBairro" placeholder="Ex.: Centro" autocomplete="address-level3"></div>
    <div class="campo"><label>Região de entrega</label><select id="fRegiao"></select></div>
  </div>
  <div class="campo"><label>Endereço completo</label><input type="text" id="fEndereco" placeholder="Rua, número, complemento" autocomplete="address-level1"></div>
  <div class="campo"><label>Ponto de referência (opcional)</label><input type="text" id="fRef" placeholder="Ex.: ao lado da padaria"></div>
  <div style="margin-top:8px">
    <label style="display:block;font-size:0.9rem;font-weight:600;color:#444;margin-bottom:5px">Forma de pagamento</label>
    <div class="pag-opcao ativa" onclick="selPag(this,'pix')"><input type="radio" name="pag" value="pix" checked style="display:none"><i class="fa fa-qrcode"></i><span>Pix</span></div>
    <div class="pag-opcao" onclick="selPag(this,'dinheiro')"><input type="radio" name="pag" value="dinheiro" style="display:none"><i class="fa fa-money-bill-wave"></i><span>Dinheiro</span></div>
  </div>
  <div class="troco-box" id="trocoBox"><label>Troco para</label><input type="text" id="fTroco" placeholder="Ex: 100,00"></div>
</div>
</div></div>

<script>
function renderItens() {
    var box = document.getElementById("cartItems");
    if (!box) return;
    box.innerHTML = "";
    if (cart.length === 0) {
        box.innerHTML = '<div class="cart-vazio"><i class="fa fa-shopping-cart"></i><p>Seu carrinho está vazio.<br>Adicione produtos no catálogo.</p></div>';
        var b = document.getElementById("btnFinalizar"); if (b) b.disabled = true;
        return;
    }
    var b = document.getElementById("btnFinalizar"); if (b) b.disabled = false;
    cart.forEach(function(i) {
        box.innerHTML += '<div class="cart-item">'
            + '<img src="' + (i.img || "img/icon-192.png") + '" alt="' + i.name + '" loading="lazy">'
            + '<div class="ci-info">'
            + '<span class="ci-name">' + i.name + '</span>'
            + '<span class="ci-price">' + formatBRL(i.priceNum) + '</span>'
            + '</div>'
            + '<div class="ci-qtd">'
            + '<button onclick="mudarQtdCarrinho(' + cart.indexOf(i) + ',-1)">-</button>'
            + '<span>' + i.qty + '</span>'
            + '<button onclick="mudarQtdCarrinho(' + cart.indexOf(i) + ',1)">+</button>'
            + '</div>'
            + '<span class="ci-subtotal">' + formatBRL(i.priceNum * i.qty) + '</span>'
            + '<button class="ci-remove" onclick="removerItem(' + cart.indexOf(i) + ')">×</button>'
            + '</div>';
    });
}
function calcular() {
    var subtotal = arredonda(calcSubtotal());
    var sel = document.getElementById("fRegiao");
    var regiaoId = sel ? sel.value : "";
    var r = (typeof calcularFrete === "function")
        ? calcularFrete(subtotal, regiaoId)
        : { subtotal: subtotal, frete: 0, total: subtotal, gratis: subtotal >= 150, faltaParaGratis: 0, regiao: null, minimo: 150 };
    var box = document.getElementById("resumoBox");
    if (box) {
        box.innerHTML = ''
            + '<div class="resumo-item"><span>Subtotal</span><span>' + formatBRL(r.subtotal) + '</span></div>'
            + '<div class="resumo-item"><span>Frete</span><span>' + (r.frete === 0 ? 'GRATIS' : formatBRL(r.frete)) + '</span></div>'
            + '<div class="resumo-row total"><span>Total final</span><span>' + formatBRL(r.total) + '</span></div>';
    }
    var minE = (typeof entregaMinima === "function") ? entregaMinima() : 100;
    var abaixoMinimo = r.subtotal > 0 && r.subtotal < minE;
    var avMin = document.getElementById("avisoMinimo");
    if (avMin) {
        if (abaixoMinimo) {
            avMin.style.display = "flex";
            var t = document.getElementById("avisoMinimoTexto");
            if (t) t.innerHTML = 'Pedido minimo para entrega: <b>' + formatBRL(minE) + '</b>. Faltam <b>' + formatBRL(arredonda(minE - r.subtotal)) + '</b>.';
        } else { avMin.style.display = "none"; }
    }
    var info = document.getElementById("infoFreteTexto");
    if (info) info.textContent = "Pedido minimo para entrega de " + formatBRL(minE) + ". Frete gratis acima de " + formatBRL(r.minimo) + ".";
    var av = document.getElementById("avisoRegiao");
    if (av) {
        if (r.frete === 0 && r.subtotal > 0 && !abaixoMinimo) {
            av.style.display = "flex"; av.className = "aviso-regiao ok";
            av.innerHTML = '<i class="fa fa-check-circle"></i><span>Frete gratis!</span>';
        } else { av.style.display = "none"; }
    }
}
function selPag(radio) {
    document.querySelectorAll(".pag-opcao").forEach(function(el) { el.classList.remove("ativa"); });
    radio.closest(".pag-opcao").classList.add("ativa");
    document.getElementById("trocoBox").style.display = (radio.value === "dinheiro") ? "block" : "none";
    calcular();
}

function finalizarPedido() {
    var d = (typeof Conta !== "undefined" && Conta.dados()) || {};
    var bairro = document.getElementById("fBairro").value.trim();
    var regiaoSel = document.getElementById("fRegiao");
    var regiaoId = regiaoSel ? regiaoSel.value : "";
    var regiaoTexto = regiaoSel ? regiaoSel.options[regiaoSel.selectedIndex].text : "";
    var endereco = document.getElementById("fEndereco").value.trim();
    var ref = document.getElementById("fRef").value.trim();
    var pagRadio = document.querySelector('input[name="pag"]:checked');
    var pagamento = pagRadio ? pagRadio.value : "pix";
    var troco = document.getElementById("fTroco").value.trim();
    if (!bairro) { alert("Informe seu bairro."); return; }
    if (!regiaoId) { alert("Escolha a regiao de entrega."); return; }
    if (!endereco) { alert("Informe o endereco completo."); return; }
    var regra = (typeof pedidosLiberados === "function") ? pedidosLiberados("") : { liberado: true, texto: "" };
    if (!regra.liberado) { alert("Pedido nao aceito.\n\n" + regra.texto); return; }
    var foraArea = (typeof bairroForaDaArea === "function") && bairroForaDaArea(bairro);
    if (foraArea) { alert("O bairro \"" + bairro + "\" nao esta na nossa area de entrega."); return; }
    var _min = (typeof entregaMinima === "function") ? entregaMinima() : 100;
    var _sub = arredonda(calcSubtotal());
    if (_sub > 0 && _sub < _min) { alert("Pedido mínimo para entrega: " + formatBRL(_min) + ".\nFaltam " + formatBRL(arredonda(_min - _sub)) + "."); return; }
    if (cart.length === 0) { alert("Seu carrinho esta vazio."); return; }
    var itens = cart.map(function(i) { return { name: i.name, qty: i.qty, priceNum: i.priceNum, subtotal: i.priceNum * i.qty }; });
    var r = (typeof calcularFrete === "function") ? calcularFrete(_sub, regiaoId) : { subtotal: _sub, frete: 0, total: _sub };
    var pedido = {
        id: "PD" + Date.now(),
        nome: String(d.nome || "").trim(), tel: String(d.tel || "").trim(), cpf: String(d.cpf || "").trim(),
        bairro: bairro, regiao: regiaoId, regiaoTexto: regiaoTexto,
        endereco: endereco + (ref ? " - " + ref : ""),
        pagamento: pagamento, troco: troco,
        itens: itens, subtotal: r.subtotal, frete: r.frete, total: r.total,
        criadoEm: Date.now(), status: "aguardando", historico: []
    };
    var pedidos = getPedidos();
    pedidos.push(pedido);
    savePedidos(pedidos);
    if (typeof enviarPedidoNuvem === "function") { try { enviarPedidoNuvem(pedido); } catch(e){} }
    if (typeof notificarTelegramPedido === "function") { try { notificarTelegramPedido(pedido); } catch(e){} }
    limparCarrinho();
    localStorage.setItem("ultimoPedido", pedido.id);
    alert("Pedido finalizado! No " + pedido.id + " - aguardando confirmacao.");
    window.location.href = "pedido-sucesso.html";
}
function abrirTelegram() {
    var tel = "5521983158911";
    var txt = "Ola, sou cliente da Refrigerantes Convencao. Quero falar com o vendedor sobre meu pedido.";
    window.open("https://wa.me/" + tel + "?text=" + encodeURIComponent(txt), "_blank");
}
var _ultimaSync = null;
function _checarSync() {
    try {
        var s = localStorage.getItem("refrigerantePedidos");
        if (s !== _ultimaSync) { _ultimaSync = s; renderItens(); calcular(); }
    } catch(e) {}
}
setInterval(_checarSync, 15000);
document.addEventListener("DOMContentLoaded", function(){
    renderItens(); calcular();
    if (typeof montarSeletorBairro === "function") montarSeletorBairro();
    updateCartCount();
});
if (document.readyState !== "loading") { renderItens(); calcular(); }
</script>
</body>
</html>
