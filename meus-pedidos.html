<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Pedidos - Refrigerantes ConvenÃ§Ã£o</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.page { padding: 110px 0 60px; background: var(--light-bg); min-height: 100vh; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
.page-head h1 { color: var(--primary-color); font-size:1.6rem; display:flex; align-items:center; gap:10px; }
.busca-card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:22px; margin-bottom:22px; }
.busca-linha { display:flex; gap:12px; flex-wrap:wrap; }
.busca-linha input { flex:1; min-width:200px; padding:13px 14px; border:1px solid #ddd; border-radius:10px; font-size:1rem; }
.busca-linha input:focus { outline:none; border-color:var(--primary-color); }
.btn-buscar { padding:13px 26px; background:var(--primary-color); color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer; }
.btn-buscar:hover { background:#c62828; }
.filtros { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.filtro { padding:7px 16px; border:1px solid #ddd; background:#fff; border-radius:18px; cursor:pointer; font-size:0.85rem; font-weight:600; color:#666; }
.filtro.ativo { background:var(--primary-color); color:#fff; border-color:var(--primary-color); }
.pedido-card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:18px 20px; margin-bottom:16px; }
.pedido-topo { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
.pedido-topo b { color:var(--text-color); font-size:1.05rem; }
.pedido-meta { font-size:0.85rem; color:#888; }
.pedido-itens { font-size:0.9rem; color:#555; }
.pedido-itens div { padding:3px 0; }
.pedido-total { display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid #eee; }
.pedido-total .val { font-size:1.2rem; font-weight:bold; color:var(--primary-color); }
.btn-detalhe { background:none; border:none; color:var(--secondary-color); cursor:pointer; font-size:0.9rem; font-weight:600; padding:6px; }
.detalhe-extra { display:none; margin-top:12px; padding:14px; background:#fafafa; border-radius:10px; font-size:0.9rem; }
.detalhe-extra div { padding:3px 0; color:#555; }
.timeline { margin-top:10px; }
.timeline-item { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:0.85rem; color:#666; }
.timeline-item i { color:var(--primary-color); }
.vazio { text-align:center; padding:50px 20px; color:#888; }
.vazio i { font-size:3rem; color:#ddd; margin-bottom:12px; }
.aviso-info { background:#e3f2fd; border-left:4px solid var(--secondary-color); padding:12px 16px; border-radius:8px; font-size:0.88rem; color:#1565c0; margin-bottom:18px; }
</style>
</head>
<body>
<header class="main-header"><div class="container"><nav>
<div class="logo"><i class="fa fa-leaf"></i><span>Refrigerantes ConvenÃ§Ã£o</span></div>
<span class="mobile-menu-btn"><span></span><span></span><span></span></span>
<ul class="nav-links" id="mainNav"><li><a href="index.html">Produtos</a></li><li><a href="meus-pedidos.html">Meus Pedidos</a></li></ul>
<div class="header-actions"></div>
</nav></div></header>

<section class="page"><div class="container">
<div class="page-head">
  <h1><i class="fa fa-clipboard-list"></i> Meus Pedidos</h1>
  <a href="index.html" style="color:#666;text-decoration:none"><i class="fa fa-arrow-left"></i> Voltar ao catÃ¡logo</a>
</div>

<div class="aviso-info"><i class="fa fa-info-circle"></i> Seus pedidos aparecem automaticamente abaixo, com data e hora.</div>

<div id="loginBox" class="busca-card">
  <div class="busca-linha">
    <input id="fNomeLogin" type="text" placeholder="Seu nome">
    <input id="fTelLogin" type="text" placeholder="Seu WhatsApp (ex: 21999999999)">
    <button class="btn-buscar" onclick="entrar()"><i class="fa fa-sign-in"></i> Entrar</button>
  </div>
</div>

<div class="filtros" id="filtros" style="display:none">
  <button class="filtro ativo" data-f="todos" onclick="filtrar('todos',this)">Todos</button>
  <button class="filtro" data-f="andamento" onclick="filtrar('andamento',this)">Em andamento</button>
  <button class="filtro" data-f="finalizados" onclick="filtrar('finalizados',this)">Finalizados</button>
</div>

<div id="usuarioLogado" style="display:none;margin-bottom:18px;background:#e8f5e9;border-left:4px solid #43a047;padding:12px 16px;border-radius:8px;font-size:0.9rem;color:#2e7d32">
  <i class="fa fa-user-check"></i> Conectado como <b id="nomeUsuario"></b> — <a href="#" onclick="sair();return false;" style="color:#c62828;font-weight:bold">sair</a>
</div>

<div id="listaPedidos"></div>
</div></section>

<script src="script.js"></script>
<script>
    // Mobile menu toggle
    const menuBtn = document.querySelector('.mobile-menu-btn');
    const nav = document.getElementById('mainNav');
    
    if (menuBtn && nav) {
        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            nav.classList.toggle('active');
        });
        
        // Close menu when clicking a link
        nav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuBtn.classList.remove('active');
                nav.classList.remove('active');
            });
        });
    }
</script>
<script>
let pedidosAtuais = [];
let filtroAtual = "todos";
let usuarioLogado = null;

function chaveSessao() { return "convencao_usuario"; }

function salvarSessao(nome, tel) {
    usuarioLogado = { nome: nome, tel: tel };
    try { localStorage.setItem(chaveSessao(), JSON.stringify(usuarioLogado)); } catch(e) {}
}
function carregarSessao() {
    try {
        var s = localStorage.getItem(chaveSessao());
        return s ? JSON.parse(s) : null;
    } catch(e) { return null; }
}
function sair() {
    try { localStorage.removeItem(chaveSessao()); } catch(e) {}
    usuarioLogado = null;
    pedidosAtuais = [];
    document.getElementById("loginBox").style.display = "";
    document.getElementById("usuarioLogado").style.display = "none";
    document.getElementById("filtros").style.display = "none";
    document.getElementById("listaPedidos").innerHTML = "";
}

function entrar() {
    const nome = document.getElementById("fNomeLogin").value.trim();
    const tel = document.getElementById("fTelLogin").value.trim();
    if (!tel) { alert("Digite seu WhatsApp."); return; }
    salvarSessao(nome || "Cliente", tel);
    carregarPedidosDoUsuario();
}

function carregarPedidosDoUsuario() {
    if (!usuarioLogado) return;
    pedidosAtuais = pedidosPorTelefone(usuarioLogado.tel);
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("usuarioLogado").style.display = "";
    document.getElementById("nomeUsuario").innerText = usuarioLogado.nome + " (" + usuarioLogado.tel + ")";
    document.getElementById("filtros").style.display = pedidosAtuais.length ? "flex" : "none";
    filtroAtual = "todos";
    document.querySelectorAll(".filtro").forEach(function(b) { b.classList.toggle("ativo", b.dataset.f === "todos"); });
    render();
}

function buscar() {
    const tel = document.getElementById("fNomeLogin").value.trim() || document.getElementById("fTelLogin").value.trim();
    if (!tel) { alert("Digite seu WhatsApp."); return; }
    salvarSessao(usuarioLogado ? usuarioLogado.nome : "Cliente", tel);
    carregarPedidosDoUsuario();
}

function filtrar(tipo, btn) {
    filtroAtual = tipo;
    document.querySelectorAll(".filtro").forEach(b => b.classList.remove("ativo"));
    btn.classList.add("ativo");
    render();
}

function render() {
    const box = document.getElementById("listaPedidos");
    let lista = pedidosAtuais;
    if (filtroAtual === "andamento") {
        lista = lista.filter(p => ["aguardando","confirmado","separacao","enviado"].includes(p.status));
    } else if (filtroAtual === "finalizados") {
        lista = lista.filter(p => ["entregue","cancelado"].includes(p.status));
    }

    if (pedidosAtuais.length === 0) {
        box.innerHTML = '<div class="vazio"><i class="fa fa-inbox"></i><p>Você ainda não fez nenhum pedido.</p><a href="index.html" class="link-voltar">Ver produtos</a></div>';
        return;
    }
    if (lista.length === 0) {
        box.innerHTML = '<div class="vazio"><i class="fa fa-filter"></i><p>Nenhum pedido neste filtro.</p></div>';
        return;
    }

    let h = "";
    lista.forEach(function(p) {
        h += '<div class="pedido-card">';
        h += '<div class="pedido-topo"><div><b>' + p.id + '</b><div class="pedido-meta">' + dataHora(p.criadoEm) + '</div></div>' + statusBadge(p.status) + '</div>';
        h += '<div class="pedido-itens">';
        p.itens.forEach(function(i) { h += '<div>' + i.name + ' x' + i.qty + '</div>'; });
        h += '</div>';
        h += '<div class="pedido-total"><button class="btn-detalhe" onclick="toggleDetalhe(\'' + p.id + '\')"><i class="fa fa-chevron-down"></i> Ver detalhes</button><span class="val">' + formatBRL(p.total) + '</span></div>';
        h += '<div class="detalhe-extra" id="det-' + p.id + '">';
        h += '<div><b>Entrega:</b> ' + p.end + (p.comp ? " (" + p.comp + ")" : "") + ' â€” ' + p.bairro + '</div>';
        h += '<div><b>Pagamento:</b> ' + p.pagamento + (p.pagamento === "Dinheiro" && p.troco ? " (troco p/ " + p.troco + ")" : "") + '</div>';
        h += '<div><b>Frete:</b> ' + (p.frete === 0 ? "GRÃTIS" : formatBRL(p.frete)) + '</div>';
        h += '<div class="timeline"><b>Acompanhamento:</b>';
        p.historico.forEach(function(ev) {
            h += '<div class="timeline-item"><i class="fa fa-circle" style="font-size:0.5rem"></i> ' + (STATUS_LABEL[ev.status] || ev.status) + ' â€” ' + dataHora(ev.quando) + '</div>';
        });
        h += '</div></div></div>';
    });
    box.innerHTML = h;
}

function toggleDetalhe(id) {
    const el = document.getElementById("det-" + id);
    if (el) el.style.display = (el.style.display === "block") ? "none" : "block";
}

document.getElementById("fTelLogin").addEventListener("keypress", function(e) { if (e.key === "Enter") entrar(); });
document.getElementById("fNomeLogin").addEventListener("keypress", function(e) { if (e.key === "Enter") entrar(); });

// restaurar sessao e mostrar pedidos automaticamente
usuarioLogado = carregarSessao();
if (usuarioLogado) carregarPedidosDoUsuario();
</script>
</body>
</html>
