<style>
.page { padding: 110px 0 60px; background: var(--light-bg); min-height: 100vh; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
.page-head h1 { color: var(--primary-color); font-size:1.6rem; display:flex; align-items:center; gap:10px; }
.busca-card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:22px; margin-bottom:22px; }
.busca-linha { display:flex; gap:12px; flex-wrap:wrap; }
.busca-linha input { flex:1; min-width:200px; padding:13px 14px; border:1px solid #ddd; border-radius:10px; font-size:1rem; }
.busca-linha input:focus { outline:none; border-color:var(--primary-color); }
.btn-buscar { padding:13px 26px; background:var(--primary-color); color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer; }
.btn-buscar:hover { background:#c62828; }
.filtros { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.filtro { padding:7px 16px; border:1px solid #ddd; background:#fff; border-radius:18px; cursor:pointer; font-size:0.85rem; font-weight:600; color:#666; }
.filtro.ativo { background:var(--primary-color); color:#fff; border-color:var(--primary-color); }
.pedido-card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:18px 20px; margin-bottom:16px; }
.pedido-topo { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
.pedido-topo b { color:var(--text-color); font-size:1.05rem; }
.pedido-meta { font-size:0.85rem; color:#6b7280; }
.pedido-itens { font-size:0.9rem; color:#555; }
.pedido-itens div { padding:3px 0; }
.pedido-total { display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid #eee; }
.pedido-total .val { font-size:1.2rem; font-weight:bold; color:var(--primary-color); }
.btn-detalhe { background:none; border:none; color:var(--secondary-color); cursor:pointer; font-size:0.9rem; font-weight:600; padding:6px; }
.detalhe-extra { display:none; margin-top:12px; padding:14px; background:#fafafa; border-radius:10px; font-size:0.9rem; }
.detalhe-extra div { padding:3px 0; color:#555; }
.timeline { margin-top:10px; }
.timeline-item { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:0.85rem; color:#666; }
.timeline-item i { color:var(--primary-color); }
.vazio { text-align:center; padding:50px 20px; color:#6b7280; }
.vazio i { font-size:3rem; color:#ddd; margin-bottom:12px; }
.vazio p { margin-bottom:14px; }
.aviso-info { background:#e3f2fd; border-left:4px solid var(--secondary-color); padding:12px 16px; border-radius:8px; font-size:0.88rem; color:#1565c0; margin-bottom:18px; }
.link-voltar { color:#666; font-size:0.95rem; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.link-voltar:hover { color: var(--primary-color); }

/* ===== barra de sessao ===== */
.sessao-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:#e8f5e9;border-left:4px solid #43a047;
    padding:12px 16px;border-radius:8px;font-size:.92rem;color:#2e7d32;margin-bottom:18px}
.sessao-bar b{color:#1b5e20}
.btn-sair{margin-left:auto;background:none;border:1px solid #c62828;color:#c62828;
    padding:6px 14px;border-radius:20px;font-size:.82rem;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
.btn-sair:hover{background:#c62828;color:#fff}

/* ===== TEMA ESCURO legivel ===== */

[data-theme="dark"] .busca-card,

[data-theme="dark"] .filtro.ativo{background:#ffb822 !important;color:#3d4465 !important;border-color:#ffb822 !important}
[data-theme="dark"] .vazio{color:#a1a8c3 !important}

[data-theme="dark"] .aviso-info{background:#232742 !important;border-left-color:#ffb822 !important;color:#e6e8f2 !important}
[data-theme="dark"] .sessao-bar{background:#232742 !important;border-left-color:#ffb822 !important;color:#e6e8f2 !important}

.pedido-topo b{font-size:1.22rem !important}

/* versao escura do boletim */

[data-theme="dark"] .pedido-itens,
[data-theme="dark"] .pedido-itens b,

[data-theme="dark"] .detalhe-extra b{color:#ffb822 !important}

/* ===== NAVEGACAO HORIZONTAL (igual a home) ===== */
.main-header{background:var(--primary-color,#3d4465)!important;position:sticky;top:0;z-index:100}
.main-header .container{max-width:1600px;width:100%;padding:0 12px}
.main-header nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;min-height:60px}
.main-header .logo{
    display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap;
    font-size:1.1rem;font-weight:800;color:var(--accent-color,#ffb822);
}
.main-header .nav-links{
    display:flex;gap:4px;list-style:none;flex:1 1 auto;min-width:0;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.main-header .nav-links::-webkit-scrollbar{display:none}
.main-header .nav-links a{
    display:flex;align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap;
    padding:9px 14px;border-radius:20px;text-decoration:none;
    color:rgba(255,255,255,.94)!important;font-size:.95rem;font-weight:700;
}
.main-header .nav-links a i{font-size:.92rem;opacity:.9}
.main-header .nav-links a:hover{background:rgba(255,255,255,.15)!important;color:#fff!important}
.main-header .nav-links a.ativo{background:var(--accent-color,#ffb822)!important;color:var(--primary-color,#3d4465)!important}
.main-header .header-actions{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.main-header .cart-icon{

}
.main-header .cart-count{background:#fc0758;color:#fff;font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:10px}

<header class="main-header"><div class="container"><nav>

<section class="page"><div class="container">

  <h1><i class="fa fa-clipboard-list"></i> Meus Pedidos</h1>
  <a href="index.html" style="color:#666;text-decoration:none"><i class="fa fa-arrow-left"></i> Voltar ao catálogo</a>
</div>

  <button class="filtro" data-f="andamento" onclick="filtrar('andamento',this)">Em andamento</button>

<script>
    // Mobile menu toggle
    const menuBtn = document.querySelector('.mobile-menu-btn');
    const nav = document.getElementById('mainNav');
    
    if (menuBtn && nav) {
        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            nav.classList.toggle('active');
        });
        
        // Close menu when clicking a link
        nav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuBtn.classList.remove('active');
                nav.classList.remove('active');
            });
        });
    }
</script>
<script>
var filtroAtual = "todos";

function chaveSessao(){ return "convencao_usuario"; }

function carregarSessao(){
  try{ var s = localStorage.getItem(chaveSessao()); return s ? JSON.parse(s) : null; }
  catch(e){ return null; }
}
function salvarSessao(nome, tel){
  var u = { nome: nome, tel: tel };
  try{ localStorage.setItem(chaveSessao(), JSON.stringify(u)); }catch(e){}
  return u;
}
function sair(){
  try{
    localStorage.removeItem(chaveSessao());
    // sai de verdade: limpa o perfil para o boletim mostrar tudo do aparelho
    localStorage.removeItem("refrigerantePerfil");
  }catch(e){}
  location.reload();
}

/* ===== SEMPRE mostra os pedidos, sem pedir numero nem nome ===== */
function mostrarPedidos(){
  var todos = getPedidos();
  var sessao = (typeof Conta !== "undefined" && !Conta.estaVazia())
        ? { nome: Conta.dados().nome, tel: Conta.dados().tel, cpf: Conta.dados().cpf }
        : null;
  var lista = [];
  var porTelefone = false;
  if (sessao && sessao.tel) {
    lista = todos.filter(function(p){ return mesmoTelefone(p.tel, sessao.tel); });
    if (lista.length) porTelefone = true;
  }
  // nao achou pelo telefone (ou nao esta logado): mostra tudo que este aparelho tem
  if (!lista.length) lista = todos.slice();

  var nomeEl = document.getElementById("nomeUsuario");
  if (nomeEl) {
      if (sessao && porTelefone) nomeEl.innerText = sessao.nome || "Cliente";
      else if (sessao) nomeEl.innerText = sessao.nome || "Cliente";
      else nomeEl.innerText = "visitante";
  }

  var aviso = document.getElementById("avisoSincronia");
  if (aviso) {
      if (!sessao) {
          aviso.style.display = "flex";
          aviso.innerHTML = '<i class="fa fa-info-circle"></i> <span>Você não está identificado. Preencha seu <a href="perfil.html" style="color:#1565c0;font-weight:700">perfil</a> para ver apenas os seus pedidos. Abaixo, todos os pedidos salvos neste aparelho.</span>';
      } else if (!porTelefone && lista.length) {
          aviso.style.display = "flex";
          aviso.innerHTML = '<i class="fa fa-sync-alt"></i> <span>Nenhum pedido antigo com o WhatsApp <b>' + sessao.tel + '</b>. Mostramos todos os pedidos salvos neste aparelho.</span>';
      } else {
          aviso.style.display = "none";
      }
  }

  var f = document.getElementById("filtros");
  if (f) f.style.display = lista.length ? "flex" : "none";

  pedidosAtuais = lista;
  filtroAtual = "todos";
  document.querySelectorAll(".filtro").forEach(function(b){
    b.classList.toggle("ativo", b.dataset.f === "todos");
  });
  render();
}
var pedidosAtuais = [];

function filtrar(tipo, btn){
  filtroAtual = tipo;
  document.querySelectorAll(".filtro").forEach(function(b){ b.classList.remove("ativo"); });
  if (btn) btn.classList.add("ativo");
  render();
}

function render(){
  var box = document.getElementById("listaPedidos");
  if (!box) return;
  var lista = pedidosAtuais;

  if (filtroAtual === "andamento") {
    lista = lista.filter(function(p){ return ["aguardando","confirmado","separacao","enviado"].indexOf(p.status) >= 0; });
  } else if (filtroAtual === "finalizados") {
    lista = lista.filter(function(p){ return ["entregue","cancelado"].indexOf(p.status) >= 0; });
  }

  if (!pedidosAtuais.length) {
    box.innerHTML = '<div class="vazio"><i class="fa fa-receipt"></i><p>Nenhum pedido salvo neste aparelho ainda.</p>'
      + '<p>Quando você fizer um pedido, ele aparece aqui automaticamente.</p>'
      + '<a href="index.html" class="link-voltar"><i class="fa fa-arrow-left"></i> Ver produtos</a></div>';
    return;
  }
  if (!lista.length) {
    box.innerHTML = '<div class="vazio"><i class="fa fa-filter"></i><p>Nenhum pedido neste filtro.</p></div>';
    return;
  }

  var h = "";
  lista.forEach(function(p){
    h += '<div class="pedido-card">';
    h += '<div class="pedido-topo"><div><b>' + p.id + '</b><div class="pedido-meta"><i class="fa fa-clock"></i> ' + dataHora(p.criadoEm) + '</div></div>' + statusBadge(p.status) + '</div>';
    h += '<div class="pedido-itens">';
    p.itens.forEach(function(i){ h += '<div>' + i.name + ' <b>x' + i.qty + '</b></div>'; });
    h += '</div>';
    h += '<div class="pedido-total"><button class="btn-detalhe" onclick="toggleDetalhe(\'' + p.id + '\')"><i class="fa fa-chevron-down"></i> Ver detalhes</button><span class="val">' + formatBRL(p.total) + '</span></div>';
    h += '<div class="detalhe-extra" id="det-' + p.id + '">';
    h += '<div><b>Cliente:</b> ' + (p.nome || "—") + (p.tel ? " &middot; " + p.tel : "") + '</div>';
    if (p.cpf) h += '<div><b>CPF:</b> ' + p.cpf + '</div>';
    h += '<div><b>Entrega:</b> ' + p.end + (p.comp ? " (" + p.comp + ")" : "") + " — " + p.bairro + '</div>';
    h += '<div><b>Pagamento:</b> ' + p.pagamento + (p.pagamento === "Dinheiro" && p.troco ? " (troco para " + p.troco + ")" : "") + '</div>';
    h += '<div><b>Frete:</b> ' + (p.frete === 0 ? "GRÁTIS" : formatBRL(p.frete)) + '</div>';
    h += '<div><b>Subtotal:</b> ' + formatBRL(p.subtotal) + '</div>';
    h += '<div class="timeline"><b>Acompanhamento:</b>';
    p.historico.forEach(function(ev){
      h += '<div class="timeline-item"><i class="fa fa-circle"></i> ' + (STATUS_LABEL[ev.status] || ev.status) + " — " + dataHora(ev.quando) + '</div>';
    });
    h += '</div></div></div>';
  });
  box.innerHTML = h;
}

function toggleDetalhe(id){
  var el = document.getElementById("det-" + id);
  if (el) el.style.display = (el.style.display === "block") ? "none" : "block";
}

document.addEventListener("DOMContentLoaded", function(){ mostrarPedidos(); });
if (document.readyState !== "loading") mostrarPedidos();

/* sincroniza: pedido feito em outra aba (ou no perfil) aparece aqui sozinho */
window.addEventListener("storage", function(e){
    if (e.key === "convencao_pedidos" || e.key === "convencao_usuario" || e.key === "refrigerantePerfil") {
        if (typeof mostrarPedidos === "function") mostrarPedidos();
    }
});
/* volta da aba do perfil: recarrega na hora */
document.addEventListener("visibilitychange", function(){
    if (!document.hidden && typeof mostrarPedidos === "function") mostrarPedidos();
});
</script>
<script>
/* destaca a pagina atual no menu */
(function(){
  try{
    var atual = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    document.querySelectorAll('.nav-links a').forEach(function(a){
      var alvo = (a.getAttribute('href') || '').split('/').pop().toLowerCase();
      if (alvo === atual) a.classList.add('ativo');
    });
  }catch(e){}
})();
</script>
