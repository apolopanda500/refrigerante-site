<style>
.page { padding: 26px 0 60px; background: var(--light-bg); min-height: 100vh; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
.page-head h1 { color: var(--primary-color); font-size:1.6rem; display:flex; align-items:center; gap:10px; }

/* ===== resumo do historico (veio do perfil) ===== */
.stats-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.stat-box{flex:1;min-width:140px;background:#fff;border-radius:14px;
 box-shadow:0 2px 12px rgba(0,0,0,.07);padding:20px;text-align:center}
.stat-box .stat-icon{font-size:1.8rem;color:var(--primary-color);margin-bottom:8px}
.stat-box .stat-num{font-size:1.6rem;font-weight:bold;color:var(--text-color)}
.stat-box .stat-label{font-size:.82rem;color:#6b7280;margin-top:4px}
[data-theme="dark"] .stat-box{background:#232742}
[data-theme="dark"] .stat-box .stat-num{color:#fff}
[data-theme="dark"] .stat-box .stat-label{color:#a1a8c3}
.pedido-sem-item{color:var(--texto-aviso);font-size:.9rem;padding:4px 0}
.filtros { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.filtro { padding:7px 16px; border:1px solid #ddd; background:#fff; border-radius:18px; cursor:pointer; font-size:0.85rem; font-weight:600; color:#666; }
.filtro.ativo { background:var(--primary-color); color:#fff; border-color:var(--primary-color); }
.pedido-card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:18px 20px; margin-bottom:16px; }
.pedido-topo { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
.pedido-topo b { color:var(--text-color); font-size:1.05rem; }
.pedido-meta { font-size:0.85rem; color:#6b7280; }
.pedido-itens { font-size:0.9rem; color:#555; }
.pedido-itens div { padding:3px 0; }
.pedido-total { display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid #eee; }
.pedido-total .val { font-size:1.2rem; font-weight:bold; color:var(--primary-color); }
.btn-detalhe { background:none; border:none; color:var(--secondary-color); cursor:pointer; font-size:0.9rem; font-weight:600; padding:6px; }
.detalhe-extra { display:none; margin-top:12px; padding:14px; background:#fafafa; border-radius:10px; font-size:0.9rem; }
.detalhe-extra div { padding:3px 0; color:#555; }
.timeline { margin-top:10px; }
.timeline-item { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:0.85rem; color:#666; }
.timeline-item i { color:var(--primary-color); }
.vazio { text-align:center; padding:50px 20px; color:#6b7280; }
.vazio i { font-size:3rem; color:#ddd; margin-bottom:12px; }
.vazio p { margin-bottom:14px; }
.aviso-info { background:#e3f2fd; border-left:4px solid var(--secondary-color); padding:12px 16px; border-radius:8px; font-size:0.88rem; color:#1565c0; margin-bottom:18px; }

/* ===== barra de sessao ===== */
.sessao-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--texto-ok-fundo);border-left:4px solid #43a047;
    padding:12px 16px;border-radius:8px;font-size:.92rem;color:var(--texto-ok);margin-bottom:18px}
.sessao-bar b{color:var(--texto-ok)}
.btn-sair{margin-left:auto;background:none;border:1px solid #c62828;color:var(--texto-erro);
    padding:6px 14px;border-radius:20px;font-size:.82rem;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
.btn-sair:hover{background:#c62828;color:#fff}

/* ===== TEMA ESCURO legivel ===== */
[data-theme="dark"] .page{background:#12121c !important}
[data-theme="dark"] .pedido-card{background:#1c1f33 !important;border:1px solid #353a5c !important}
[data-theme="dark"] .page-head h1{color:#ffb822 !important}
[data-theme="dark"] .page-head a{color:#a1a8c3 !important}
[data-theme="dark"] .pedido-topo b{color:#e6e8f2 !important}
[data-theme="dark"] .pedido-meta{color:#a1a8c3 !important}
[data-theme="dark"] .pedido-itens{color:#cdd2e6 !important}
[data-theme="dark"] .pedido-total{border-top-color:#353a5c !important}
[data-theme="dark"] .pedido-total .val{color:#ffb822 !important}
[data-theme="dark"] .detalhe-extra{background:#232742 !important;border:1px solid #353a5c !important}
[data-theme="dark"] .detalhe-extra div{color:#cdd2e6 !important}
[data-theme="dark"] .detalhe-extra b{color:#ffb822 !important}
[data-theme="dark"] .timeline-item{color:#cdd2e6 !important}
[data-theme="dark"] .timeline-item i{color:#ffb822 !important}
[data-theme="dark"] .btn-detalhe{color:#ffb822 !important}
[data-theme="dark"] .filtro{background:#232742 !important;border-color:#353a5c !important;color:#cdd2e6 !important}
[data-theme="dark"] .filtro.ativo{background:#ffb822 !important;color:#3d4465 !important;border-color:#ffb822 !important}
[data-theme="dark"] .vazio{color:#a1a8c3 !important}
[data-theme="dark"] .vazio i{color:#353a5c !important}
[data-theme="dark"] .aviso-info{background:#232742 !important;border-left-color:#ffb822 !important;color:#e6e8f2 !important}
[data-theme="dark"] .sessao-bar{background:#232742 !important;border-left-color:#ffb822 !important;color:#e6e8f2 !important}
[data-theme="dark"] .sessao-bar b{color:#ffb822 !important}
[data-theme="dark"] .btn-sair{border-color:#ff6b6b !important;color:#ff8a8a !important}
[data-theme="dark"] .btn-sair:hover{background:#ff6b6b !important;color:#fff !important}

/* ===== BOLETIM DE PEDIDOS: letras maiores e legiveis ===== */
.pedido-card{padding:22px 24px !important;margin-bottom:20px !important}
.pedido-topo b{font-size:1.22rem !important}
.pedido-meta{font-size:1rem !important;color:#6b7280 !important;margin-top:4px}
.pedido-meta i{margin-right:5px}
.pedido-itens{font-size:1.04rem !important;color:#3d4465 !important;line-height:1.75}
.pedido-itens b{color:#3d4465}
.pedido-total{margin-top:16px !important;padding-top:14px !important}
.pedido-total .val{font-size:1.5rem !important}
.btn-detalhe{font-size:1rem !important;padding:9px 12px !important}
.detalhe-extra{font-size:1.02rem !important;padding:18px !important;line-height:1.85}
.detalhe-extra div{padding:5px 0 !important}
.detalhe-extra b{color:#3d4465 !important}
.timeline-item{font-size:.98rem !important;padding:7px 0 !important;color:#3d4465 !important}
.timeline-item i{font-size:.62rem !important}
.filtro{padding:11px 20px !important;font-size:1rem !important}
.filtro .cn,.ti .cn{font-size:.82rem !important}
.vazio p{font-size:1.08rem !important}
.vazio i{font-size:3.4rem !important}
.page-head h1{font-size:1.9rem !important}

/* versao escura do boletim */
[data-theme="dark"] .pedido-meta{color:#a1a8c3 !important}
[data-theme="dark"] .pedido-itens,
[data-theme="dark"] .pedido-itens b,
[data-theme="dark"] .timeline-item{color:#cdd2e6 !important}
[data-theme="dark"] .detalhe-extra b{color:#ffb822 !important}
[data-theme="dark"] .filtro{font-size:1rem !important}

/* ===== NAVEGACAO HORIZONTAL (igual a home) ===== */
.main-header{background:var(--primary-color,#3d4465)!important;position:fixed;top:0;left:0;right:0;z-index:100}
.main-header .container{max-width:1600px;width:100%;padding:0 12px}
.main-header nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;min-height:60px}
.main-header .logo{
    display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap;
    font-size:1.1rem;font-weight:800;color:var(--accent-color,#ffb822);
}
.main-header .nav-links{
    display:flex;gap:4px;list-style:none;flex:1 1 auto;min-width:0;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.main-header .nav-links::-webkit-scrollbar{display:none}
.main-header .nav-links a{
    display:flex;align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap;
    padding:9px 14px;border-radius:20px;text-decoration:none;
    color:rgba(255,255,255,.94)!important;font-size:.95rem;font-weight:700;
}
.main-header .nav-links a i{font-size:.92rem;opacity:.9}
.main-header .nav-links a:hover{background:rgba(255,255,255,.15)!important;color:#fff!important}
.main-header .nav-links a.ativo{background:var(--accent-color,#ffb822)!important;color:var(--primary-color,#3d4465)!important}
.main-header .header-actions{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.main-header .cart-icon{
    display:flex;align-items:center;justify-content:center;width:44px;height:44px;
    border-radius:50%;background:rgba(255,255,255,.14);color:#fff!important;font-size:1.15rem;
}
.main-header .cart-count{background:#fc0758;color:#fff;font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:10px}
.main-header .mobile-menu-btn{display:none!important}
[data-theme="dark"] .main-header{background:#232742!important}
[data-theme="dark"] .main-header .nav-links a.ativo{background:#ffb822!important;color:#3d4465!important}
@media(max-width:640px){
    .main-header .logo span{display:none}
    .main-header .logo{font-size:0}
    .main-header .logo i{font-size:1.4rem}
    .main-header .nav-links a{padding:9px 12px;font-size:.9rem}
}

/* ===== BOTÕES - tamanho mínimo 44px e cores por tema ===== */
.tick-min,
.qb,
.qa,
.bs,
.btn-primario,
.btn-secundario,
.btn-mini,
.btn-detalhe{
    min-width:44px;min-height:44px;border-radius:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .15s ease;
}
.tick-min:active,.qb:active,.qa:active,.bs:active,.btn-primario:active,.btn-secundario:active,.btn-mini:active,.btn-detalhe:active{transform:scale(.94);}

/* Botão minimizar ticks */
.tick-min{background:none;border:none;color:var(--primary-color,#3d4465);font-size:.95rem;font-weight:800;padding:4px 12px;line-height:1;min-width:44px;min-height:44px}
.tick-min:hover{background:rgba(61,68,101,.1)}
[data-theme="dark"] .tick-min{color:#c3cae0}
[data-theme="dark"] .tick-min:hover{background:rgba(255,255,255,.08)}
[data-theme="guara"] .tick-min{color:#1b7f3b}
[data-theme="guara"] .tick-min:hover{background:rgba(27,127,59,.1)}
[data-theme="rosa"] .tick-min{color:#8e2f6b}
[data-theme="rosa"] .tick-min:hover{background:rgba(142,47,107,.1)}
[data-theme="vermelho"] .tick-min{color:#a11b0f}
[data-theme="vermelho"] .tick-min:hover{background:rgba(161,27,15,.1)}

<script>
var filtroAtual = "todos";

function chaveSessao(){ return "convencao_usuario"; }

function carregarSessao(){
  try{ var s = localStorage.getItem(chaveSessao()); return s ? JSON.parse(s) : null; }
  catch(e){ return null; }
}
function salvarSessao(nome, tel){
  var u = { nome: nome, tel: tel };
  try{ localStorage.setItem(chaveSessao(), JSON.stringify(u)); }catch(e){}
  return u;
}
function sair(){
  try{
    localStorage.removeItem(chaveSessao());
    // sai de verdade: limpa o perfil para o boletim mostrar tudo do aparelho
    localStorage.removeItem("refrigerantePerfil");
  }catch(e){}
  location.reload();
}

/* ===== SEMPRE mostra os pedidos, sem pedir numero nem nome ===== */
function mostrarPedidos(){
  var todos = getPedidos();
  var sessao = (typeof Conta !== "undefined" && !Conta.estaVazia())
        ? { nome: Conta.dados().nome, tel: Conta.dados().tel, cpf: Conta.dados().cpf }
        : null;
  var lista = [];
  var porTelefone = false;
  if (sessao && sessao.tel) {
    lista = todos.filter(function(p){ return mesmoTelefone(p.tel, sessao.tel); });
    if (lista.length) porTelefone = true;
  }
  // nao achou pelo telefone (ou nao esta logado): mostra tudo que este aparelho tem
  if (!lista.length) lista = todos.slice();

  /* identidade do historico = PERFIL (fonte unica). Sem perfil, nao finge login */
  var textoEl = document.getElementById("sessaoTexto");
  if (textoEl) {
      if (sessao && sessao.nome) {
          textoEl.innerHTML = 'Conectado como <b>' + sessao.nome + '</b>';
      } else {
          textoEl.innerHTML = 'Sem perfil — preencha o perfil para ver so os seus pedidos';
      }
  }

  var aviso = document.getElementById("avisoSincronia");
  if (aviso) {
      if (!sessao) {
          aviso.style.display = "flex";
          aviso.innerHTML = '<i class="fa fa-info-circle"></i> <span>Você não está identificado. Preencha seu <a href="perfil.html" style="color:#1565c0;font-weight:700">perfil</a> para ver apenas os seus pedidos. Abaixo, todos os pedidos salvos neste aparelho.</span>';
      } else if (!porTelefone && lista.length) {
          aviso.style.display = "flex";
          aviso.innerHTML = '<i class="fa fa-sync-alt"></i> <span>Nenhum pedido antigo com o WhatsApp <b>' + sessao.tel + '</b>. Mostramos todos os pedidos salvos neste aparelho.</span>';
      } else {
          aviso.style.display = "none";
      }
  }

  var f = document.getElementById("filtros");
  if (f) f.style.display = lista.length ? "flex" : "none";

  pedidosAtuais = lista;
  filtroAtual = "todos";
  document.querySelectorAll(".filtro").forEach(function(b){
    b.classList.toggle("ativo", b.dataset.f === "todos");
  });
  render();
}
/* ---------- resumo: pedidos, itens e total gasto (veio do perfil) ---------- */
function resumoHistorico() {
    var lista = pedidosAtuais || [];
    var tp = 0, ti = 0, tg = 0;
    lista.forEach(function (p) {
        tp++;
        var itens = Array.isArray(p.itens) ? p.itens : [];
        itens.forEach(function (i) { ti += (i.qty || 0); });
        if (p.status !== "cancelado") tg += (p.total || 0);
    });
    var set = function (id, txt) { var el = document.getElementById(id); if (el) el.textContent = txt; };
    set("statPedidos", String(tp));
    set("statItens", String(ti));
    set("statGasto", formatBRL(tg));
    var bloco = document.getElementById("resumoHistorico");
    if (bloco) bloco.style.display = tp ? "flex" : "none";
}

var pedidosAtuais = [];

function filtrar(tipo, btn){
  filtroAtual = tipo;
  document.querySelectorAll(".filtro").forEach(function(b){ b.classList.remove("ativo"); });
  if (btn) btn.classList.add("ativo");
  render();
}

function render(){
  var box = document.getElementById("listaPedidos");
  if (!box) return;
  var lista = pedidosAtuais;
  resumoHistorico();

  if (filtroAtual === "andamento") {
    lista = lista.filter(function(p){ return ["aguardando","confirmado","separacao","enviado"].indexOf(p.status) >= 0; });
  } else if (filtroAtual === "finalizados") {
    lista = lista.filter(function(p){ return ["entregue","cancelado"].indexOf(p.status) >= 0; });
  }

  if (!pedidosAtuais.length) {
    box.innerHTML = '<div class="vazio"><i class="fa fa-receipt"></i><p>Nenhum pedido salvo neste aparelho ainda.</p>'
      + '<p>Quando você fizer um pedido, ele aparece aqui automaticamente.</p></div>';
    return;
  }
  if (!lista.length) {
    box.innerHTML = '<div class="vazio"><i class="fa fa-filter"></i><p>Nenhum pedido neste filtro.</p></div>';
    return;
  }

  var h = "";
  lista.forEach(function(p){
    /* pedido veio da nuvem ou de uma versao antiga: nao pode quebrar a tela */
    var itens   = Array.isArray(p.itens) ? p.itens : [];
    var hist    = Array.isArray(p.historico) ? p.historico : [];
    var sub     = (p.subtotal !== undefined) ? p.subtotal : (p.total || 0);
    var entrega = [p.end, p.comp, p.bairro].filter(Boolean).join(" - ") || "—";
    h += '<div class="pedido-card">';
    h += '<div class="pedido-topo"><div><b>' + (p.id || "—") + '</b><div class="pedido-meta"><i class="fa fa-clock"></i> '
       + (typeof dataHoraSegundos === "function" ? dataHoraSegundos(p.criadoEm) : dataHora(p.criadoEm))
       + (typeof tempoDesde === "function" && tempoDesde(p.criadoEm) ? " (" + tempoDesde(p.criadoEm) + ")" : "")
       + '</div></div>' + statusBadge(p.status) + '</div>';
    h += '<div class="pedido-itens">';
    if (itens.length) itens.forEach(function(i){ h += '<div>' + (i.name || "item") + ' <b>x' + (i.qty || 0) + '</b></div>'; });
    else h += '<div class="pedido-sem-item">Itens deste pedido nao estao salvos neste aparelho.</div>';
    h += '</div>';
    h += '<div class="pedido-total"><button class="btn-detalhe" onclick="toggleDetalhe(\'' + p.id + '\')"><i class="fa fa-chevron-down"></i> Ver detalhes</button><span class="val">' + formatBRL(p.total) + '</span></div>';
    h += '<div class="detalhe-extra" id="det-' + p.id + '">';
    h += '<div><b>Cliente:</b> ' + (p.nome || "—") + (p.tel ? " &middot; " + p.tel : "") + '</div>';
    if (p.cpf) h += '<div><b>CPF:</b> ' + p.cpf + '</div>';
    h += '<div><b>Entrega:</b> ' + entrega + '</div>';
    h += '<div><b>Pagamento:</b> ' + (p.pagamento || "—") + (p.pagamento === "Dinheiro" && p.troco ? " (troco para " + p.troco + ")" : "") + '</div>';
    h += '<div><b>Frete:</b> ' + (p.frete === 0 ? "GRÁTIS" : formatBRL(p.frete || 0)) + '</div>';
    h += '<div class="subtotal"><b>Subtotal:</b> ' + formatBRL(sub) + '</div>';
    /* ACOMPANHAMENTO: fica recolhido (so o resumo) e abre com um toque,
       para a tela nao crescer a cada pedido */
    var ultimo = hist.length ? hist[hist.length - 1] : null;
    var parado = ultimo
        ? (STATUS_LABEL[ultimo.status] || ultimo.status) + " ha " + (typeof tempoDesde === "function" ? tempoDesde(ultimo.quando) : "")
        : "aguardando";
    h += '<div class="timeline-resumo">'
       + '<button type="button" class="btn-detalhe" onclick="toggleTicks(\'' + p.id + '\')">'
       + '<i class="fa fa-clock"></i> Acompanhamento</button>'
       + '<button type="button" class="tick-min" onclick="toggleTicks(\'' + p.id + '\')" title="Minimizar">—</button>'
       + '<span>' + parado + '</span></div>';
    h += '<div class="timeline" id="ticks-' + p.id + '" style="display:none">';
    if (hist.length) hist.forEach(function(ev){
        h += '<div class="timeline-item"><i class="fa fa-circle"></i> ' + (STATUS_LABEL[ev.status] || ev.status)
           + " — " + (typeof dataHoraSegundos === "function" ? dataHoraSegundos(ev.quando) : dataHora(ev.quando))
           + ' <span class="sub">(' + (typeof tempoDesde === "function" ? tempoDesde(ev.quando) : "") + ')</span></div>';
    });
    else h += '<div class="timeline-item"><i class="fa fa-circle"></i> aguardando — sem histórico salvo</div>';
    h += '</div>';
    /* avaliacao de estrelas: so no pedido entregue */
    if (p.status === "entregue") {
        var av = (typeof avaliacaoDoPedido === "function") ? avaliacaoDoPedido(p.id) : null;
        h += '<div class="avaliar-resumo">' + (av
            ? '<span>' + (typeof estrelasHTML === "function" ? estrelasHTML(av.estrelas, 1) : av.estrelas + " estrelas") + '</span>'
            : '<span>Avalie a entrega deste pedido</span>')
          + '<button type="button" class="btn-detalhe" onclick="toggleAvaliar(\'' + p.id + '\')">'
          + '<i class="fa fa-star"></i> ' + (av ? "Mudar nota" : "Avaliar") + '</button></div>';
        h += '<div class="avaliar-box" id="av-' + p.id + '" style="display:none">' + caixaAvaliar(p, av) + '</div>';
    }
    h += '</div>';
  });
  box.innerHTML = h;
}

/* ---------- avaliacao de estrelas (1 a 5 + comentario) ---------- */
var votoEstrelas = {};
function caixaAvaliar(p, av) {
    var h = '<b><i class="fa fa-star"></i> Sua nota para este pedido</b><div class="voto">';
    for (var i = 1; i <= 5; i++) {
        h += '<button type="button" class="' + (av && av.estrelas >= i ? "on" : "")
           + '" onclick="votarEstrela(\'' + p.id + '\',' + i + ')" aria-label="' + i + ' estrela'
           + (i > 1 ? "s" : "") + '"><i class="fa fa-star"></i></button>';
    }
    h += '</div><textarea id="avTexto-' + p.id + '" maxlength="500" placeholder="Comentário (opcional)">'
       + (av && av.texto ? String(av.texto).replace(/</g, "&lt;") : "") + '</textarea>'
       + '<button type="button" class="btn-detalhe" onclick="salvarVoto(\'' + p.id + '\')">'
       + '<i class="fa fa-check"></i> Enviar avaliação</button>';
    return h;
}
function toggleAvaliar(id) {
    var el = document.getElementById("av-" + id);
    if (!el) return;
    var abriu = (el.style.display !== "block");
    el.style.display = abriu ? "block" : "none";
    if (abriu && votoEstrelas[id] === undefined) {
        var av = (typeof avaliacaoDoPedido === "function") ? avaliacaoDoPedido(id) : null;
        votoEstrelas[id] = av ? av.estrelas : 0;
    }
    if (abriu && votoEstrelas[id]) votarEstrela(id, votoEstrelas[id]);
}
function votarEstrela(id, n) {
    votoEstrelas[id] = n;
    var box = document.getElementById("av-" + id);
    if (!box) return;
    box.querySelectorAll(".voto button").forEach(function (b, i) {
        b.classList.toggle("on", i < n);
    });
}
function salvarVoto(id) {
    var n = votoEstrelas[id] || 0;
    if (!n) { alert("Toque nas estrelas para dar a nota (1 a 5)."); return; }
    var texto = (document.getElementById("avTexto-" + id) || {}).value || "";
    if (typeof salvarAvaliacao === "function") salvarAvaliacao(id, n, texto);
    render();
}

function toggleDetalhe(id){
  var el = document.getElementById("det-" + id);
  if (el) el.style.display = (el.style.display === "block") ? "none" : "block";
}
/* os ticks (acompanhamento) abrem e fecham: a tela nao cresce */
function toggleTicks(id){
  var el = document.getElementById("ticks-" + id);
  if (el) el.style.display = (el.style.display === "block") ? "none" : "block";
}

document.addEventListener("DOMContentLoaded", function(){ mostrarPedidos(); });
if (document.readyState !== "loading") mostrarPedidos();

/* sincroniza: pedido feito em outra aba (ou no perfil) aparece aqui sozinho */
window.addEventListener("storage", function(e){
    if (e.key === "convencao_pedidos" || e.key === "convencao_usuario" || e.key === "refrigerantePerfil") {
        if (typeof mostrarPedidos === "function") mostrarPedidos();
    }
});
/* volta da aba do perfil: recarrega na hora */
document.addEventListener("visibilitychange", function(){
    if (!document.hidden && typeof mostrarPedidos === "function") mostrarPedidos();
});
</script>
