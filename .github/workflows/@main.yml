name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate site
      run: |
        # Validar HTML, CSS, JS
        for f in *.js; do node --check "$f" || exit 1; done
        echo "Validando site..."

    - name: Preparar arquivos do site
      run: |
        rm -rf dist
        mkdir -p dist
        git archive HEAD | tar -x -C dist
        echo "Arquivos preparados:"
        ls dist | head -30

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist