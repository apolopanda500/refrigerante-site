# Deploy: o proprio GitHub Pages (pages-build-deployment) publica
# automaticamente o branch main a cada push. Nao é preciso workflow extra.
# Este arquivo fica apenas como documentacao do processo.
name: Deploy to GitHub Pages (informativo)

on:
  push:
    branches: [main]

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Validar JS do site
        run: |
          for f in *.js; do node --check "$f" || exit 1; done
          echo "Sintaxe OK. O GitHub Pages publica o branch main automaticamente."