# ============================================
# BOT DO TELEGRAM PARA CLIENTES - CONVENÇÃO
# Roda no servidor (GitHub Actions), a cada 5 minutos
# para que os comandos do bot funcionem para os clientes
# ============================================

name: Bot do Telegram - Clientes

on:
  schedule:
    # a cada 5 minutos (o mínimo que o GitHub aceita)
    - cron: '*/5 * * * *'
  workflow_dispatch:        # rodar na mão pela aba Actions
  push:
    paths:
      - '.github/scripts/bot-clientes.js'
      - '.github/workflows/bot-clientes.yml'

concurrency:
  group: bot-clientes
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verificar sintaxe
        run: node --check .github/scripts/bot-clientes.js

      - name: Atender o bot (uma rodada)
        env:
          TG_TOKEN_CLIENTES: ${{ secrets.TG_TOKEN_CLIENTES || 'SEU_TOKEN_AQUI' }}
          TG_CHAT_CLIENTES: ${{ secrets.TG_CHAT_CLIENTES || '' }}
        run: node .github/scripts/bot-clientes.js