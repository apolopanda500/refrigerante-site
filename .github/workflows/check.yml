name: Check syntax
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Sintaxe de todo JS (site, testes e robos)
        shell: bash
        run: |
          for f in *.js tests/*.js .github/scripts/*.js; do
            node --check "$f" || exit 1
          done
          echo "Sintaxe OK"
      - name: Baterias de teste (TUDO 10/10)
        run: node tests/rodar-todos.js
