name: Check syntax
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          for f in *.js; do node --check "$f" || exit 1; done
          echo "OK"
