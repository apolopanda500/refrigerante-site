# ============================================
# BOT DO TELEGRAM 24/7 - CONVENCAO
# Roda no servidor (GitHub Actions), a cada ~5 minutos,
# para que os BOTOES e COMANDOS do bot funcionem mesmo
# com o painel (admin.html) fechado.
#
# O que faz (uma rodada):
# - le o Telegram (getUpdates);
# - aplica o status no pedido gravado no Firebase;
# - responde/edita a mensagem no chat do dono;
# - guarda o offset no Firebase (nao repete o toque).
#
# O painel continua sendo a tela principal; o bot so
# garante que nada fique "parado" quando ele esta fechado.
# ============================================
name: Bot do Telegram 24/7

on:
  schedule:
    # a cada 5 minutos (o minimo que o GitHub aceita)
    - cron: '*/5 * * * *'
  workflow_dispatch:        # rodar na mao pela aba Actions
  push:
    paths:
      - '.github/scripts/bot-telegram.js'
      - '.github/workflows/bot.yml'

concurrency:
  group: bot-telegram
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verificar sintaxe
        run: node --check .github/scripts/bot-telegram.js

      - name: Atender o bot (uma rodada)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}   # segredo do GitHub: o token nao vive no codigo
          TG_CHAT:  ${{ secrets.TG_CHAT_ID || '1810807613' }}
        run: node .github/scripts/bot-telegram.js
