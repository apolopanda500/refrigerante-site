# ============================================
# ROBO DO CATALOGO - CONVENCAO
# De segunda a sexta, 10:00 e 14:00 (fuso de Sao Paulo),
# entra no site oficial, ve os produtos disponiveis,
# baixa as fotos e atualiza o catalogo.json do site.
#
# O que o robo NAO mexe:
# - horarios de funcionamento
# - regioes e dias de entrega
# - valores de frete
# - qualquer coisa em loja.js
# ============================================
name: Atualizar catalogo

on:
  schedule:
    # 10:00 de segunda a sexta (13:00 UTC = 10:00 em SP)
    - cron: '0 13 * * 1-5'
    # 14:00 de segunda a sexta (17:00 UTC = 14:00 em SP)
    - cron: '0 17 * * 1-5'
  workflow_dispatch:        # da para rodar na mao pela aba Actions
  push:
    paths:
      - '.github/scripts/sync-catalogo.js'
      - '.github/workflows/catalogo.yml'

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ler catalogo oficial e atualizar
        run: node .github/scripts/sync-catalogo.js

      - name: Conferir o catalogo.json
        run: |
          node -e "const c=require('./catalogo.json'); if(!c.produtos||!c.produtos.length){console.error('catalogo vazio');process.exit(1)} console.log('catalogo ok:', c.produtos.length, 'produtos, gerado em', c.geradoEm);"

      - name: Publicar (commit automatico)
        id: publicar
        run: |
          git config user.name  "robo-catalogo"
          git config user.email "robo-catalogo@users.noreply.github.com"
          git add catalogo.json img/cat/
          if git diff --staged --quiet; then
            echo "Nada mudou no catalogo. Site oficial igual ao de ontem."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Catalogo atualizado automaticamente ($(date -u '+%d/%m/%Y %H:%M UTC'))"
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir se o dono mudou algum preco no site oficial
        id: deteccao
        run: |
          # O robo nao aplica preco: ele so avisa. Aqui lemos o resumo para
          # decidir se vale a pena mandar mensagem no Telegram.
          node -e "
            const r = require('./.github/scripts/ultimo-resumo.json');
            const mudaram = (r.precosOficiaisMudaram || []).length;
            console.log('precos diferentes do site oficial:', mudaram);
            require('fs').writeFileSync(process.env.GITHUB_OUTPUT, 'preciosMudaram=' + (mudaram > 0 ? 'true' : 'false') + '\n');
          "

      - name: Avisar no Telegram
        if: steps.publicar.outputs.mudou == 'true' || steps.deteccao.outputs.preciosMudaram == 'true'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}   # segredo do GitHub: o token nao vive no codigo
          TG_CHAT:  ${{ secrets.TG_CHAT_ID || '1810807613' }}
        run: |
          node -e "
            const r = require('./.github/scripts/ultimo-resumo.json');
            let t = 'CATALOGO ATUALIZADO\n\n';
            t += 'Produtos no site: ' + r.total + '\n';
            if (r.novos && r.novos.length) t += 'Entraram: ' + r.novos.join(', ') + '\n';
            if (r.sumiram && r.sumiram.length) t += 'Saíram (acabaram): ' + r.sumiram.join(', ') + '\n';
            if (!r.novos.length && !r.sumiram.length) t += 'Entraram/saíram: nada\n';
            t += '\nPreços: mantidos pelo dono (' + r.precosDoDono + '/' + r.total + '). O robô não altera preços.';
            if (r.precosOficiaisNovos && r.precosOficiaisNovos.length) {
              t += '\nNovos usando preço do site (ajuste no painel): ' + r.precosOficiaisNovos.map(p => p.nm).join(', ');
            }
            /* o dono mudou o preco no site oficial: o robo avisa, NAO aplica */
            if (r.precosOficiaisMudaram && r.precosOficiaisMudaram.length) {
              t += '\n\n!! PREÇO MUDOU NO SITE OFICIAL (' + r.precosOficiaisMudaram.length + '):';
              r.precosOficiaisMudaram.slice(0, 12).forEach(p => {
                t += '\n- ' + p.nm + ': seu ' + p.base + ' / site ' + p.oficial;
              });
              t += '\nO robo NAO mudou o preco do site. Ajuste no painel para acompanhar.';
            }
            require('fs').writeFileSync('telegram.txt', t);
          "
          curl -s -G "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
               --data-urlencode "chat_id=${TG_CHAT}" \
               --data-urlencode "text=$(cat telegram.txt)" \
               --data-urlencode "disable_web_page_preview=true" > /dev/null && echo "Aviso enviado no Telegram."

      - name: Resumo da execucao
        if: always()
        run: |
          {
            echo "### Catalogo atualizado"
            echo ""
            node -e "const c=require('./catalogo.json'); console.log('Produtos disponiveis: **'+c.produtos.length+'**'); console.log('Categorias: '+[...new Set(c.produtos.map(p=>p.ct))].join(', ')); console.log('Ultima leitura: '+c.geradoEm);" || true
          } >> "$GITHUB_STEP_SUMMARY"