<style>
.page { padding: 26px 0 60px; background: var(--light-bg); min-height: 100vh; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
.page-head h1 { color: var(--primary-color); font-size:1.6rem; display:flex; align-items:center; gap:10px; }
.perfil-card { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:22px; margin-bottom:18px; }
.perfil-card h2 { font-size:1.1rem; color:var(--text-color); margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.perfil-card h2 i { color:var(--primary-color); }
.perfil-avatar { display:flex; flex-direction:column; align-items:center; padding:30px 20px; text-align:center; }
.perfil-avatar .avatar-circle { width:100px; height:100px; border-radius:50%; background:linear-gradient(135deg, var(--primary-color), var(--secondary-color)); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.perfil-avatar .avatar-circle i { font-size:2.8rem; color:#fff; }
.perfil-avatar .avatar-name { font-size:1.3rem; font-weight:bold; color:var(--text-color); }
.perfil-avatar .avatar-email { color:#6b7280; font-size:0.9rem; margin-top:4px; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-weight:600; margin-bottom:6px; color:var(--text-color); font-size:0.9rem; }
.form-group input { width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:10px; font-size:1rem; font-family:inherit; transition:border-color 0.3s; }
.form-group input:focus { outline:none; border-color:var(--primary-color); }
.form-row { display:flex; gap:14px; flex-wrap:wrap; }
.form-row .form-group { flex:1; min-width:180px; }
.btn-salvar { padding:12px 30px; background:var(--primary-color); color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.btn-salvar:hover { background:#c62828; }
.btn-perigo { padding:12px 30px; background:#ff5252; color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.btn-perigo:hover { background:#d32f2f; }
.status-msg { display:none; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-weight:600; }
.status-msg.ok { background:var(--texto-ok-fundo); color:var(--texto-ok); border-left:4px solid #43a047; }
.perfil-card h2 small { font-weight:600; font-size:.8rem; color:#6b7280; }

/* ===== avatar do perfil ===== */
.perfil-avatar-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.perfil-avatar{
    position:relative;width:96px;height:96px;flex:0 0 96px;
    border-radius:50%;border:4px solid var(--accent-color);
    background:#eeeef4;padding:0;cursor:pointer;overflow:visible;
}
.perfil-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.perfil-avatar .pa-texto{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:2.1rem;font-weight:800;color:#646c9a;
}
.perfil-avatar .pa-lapis{
    position:absolute;right:-4px;bottom:-4px;width:32px;height:32px;border-radius:50%;
    background:#3d4465;color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:.78rem;border:3px solid #fff;
}
.perfil-dados{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1}
.perfil-dados b{font-size:1.25rem;color:var(--primary-color)}
.perfil-dados small{color:#6b7280;font-size:.88rem}
[data-theme="dark"] .perfil-avatar{background:#232742}
[data-theme="dark"] .perfil-avatar .pa-texto{color:#a1a8c3}
[data-theme="dark"] .perfil-avatar .pa-lapis{background:#ffb822;color:#3d4465;border-color:#1c1f33}
[data-theme="dark"] .perfil-dados b{color:#ffb822}
[data-theme="dark"] .perfil-dados small{color:#a1a8c3}

/* ===== NAVEGACAO HORIZONTAL (igual a home) ===== */
.main-header{background:var(--primary-color,#3d4465)!important;position:fixed;top:0;left:0;right:0;z-index:100}
.main-header .container{max-width:1600px;width:100%;padding:0 12px}
.main-header nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;min-height:60px}
.main-header .logo{
    display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap;
    font-size:1.1rem;font-weight:800;color:var(--accent-color,#ffb822);
}
.main-header .nav-links{
    display:flex;gap:4px;list-style:none;flex:1 1 auto;min-width:0;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.main-header .nav-links::-webkit-scrollbar{display:none}
.main-header .nav-links a{
    display:flex;align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap;
    padding:9px 14px;border-radius:20px;text-decoration:none;
    color:rgba(255,255,255,.94)!important;font-size:.95rem;font-weight:700;
}
.main-header .nav-links a i{font-size:.92rem;opacity:.9}
.main-header .nav-links a:hover{background:rgba(255,255,255,.15)!important;color:#fff!important}
.main-header .nav-links a.ativo{background:var(--accent-color,#ffb822)!important;color:var(--primary-color,#3d4465)!important}
.main-header .header-actions{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.main-header .cart-icon{
    display:flex;align-items:center;justify-content:center;width:44px;height:44px;
    border-radius:50%;background:rgba(255,255,255,.14);color:#fff!important;font-size:1.15rem;
}
.main-header .cart-count{background:#fc0758;color:#fff;font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:10px}
.main-header .mobile-menu-btn{display:none!important}
[data-theme="dark"] .main-header{background:#232742!important}
[data-theme="dark"] .main-header .nav-links a.ativo{background:#ffb822!important;color:#3d4465!important}
@media(max-width:640px){
    .main-header .logo span{display:none}
    .main-header .logo{font-size:0}
    .main-header .logo i{font-size:1.4rem}
    .main-header .nav-links a{padding:9px 12px;font-size:.9rem}
}

/* ===== BOTÕES - tamanho mínimo 44px e cores por tema ===== */
.tick-min,
.qb,
.qa,
.bs,
.btn-primario,
.btn-secundario,
.btn-mini,
.btn-detalhe{
    min-width:44px;min-height:44px;border-radius:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .15s ease;
}
.tick-min:active,.qb:active,.qa:active,.bs:active,.btn-primario:active,.btn-secundario:active,.btn-mini:active,.btn-detalhe:active{transform:scale(.94);}

/* Botão minimizar ticks */
.tick-min{background:none;border:none;color:var(--primary-color,#3d4465);font-size:.95rem;font-weight:800;padding:4px 12px;line-height:1;min-width:44px;min-height:44px}
.tick-min:hover{background:rgba(61,68,101,.1)}
[data-theme="dark"] .tick-min{color:#c3cae0}
[data-theme="dark"] .tick-min:hover{background:rgba(255,255,255,.08)}
[data-theme="guara"] .tick-min{color:#1b7f3b}
[data-theme="guara"] .tick-min:hover{background:rgba(27,127,59,.1)}
[data-theme="rosa"] .tick-min{color:#8e2f6b}
[data-theme="rosa"] .tick-min:hover{background:rgba(142,47,107,.1)}
[data-theme="vermelho"] .tick-min{color:#a11b0f}
[data-theme="vermelho"] .tick-min:hover{background:rgba(161,27,15,.1)}

/* Botões de quantidade dos produtos */
.qb{background:#eef0f6;border:none;font-size:1.05rem;color:#3d4465}
.qb:hover{background:#e2e5ef}
.qv{border-left:2px solid #d8dbe6;border-right:2px solid #d8dbe6}

[data-theme="dark"] .qb:hover{background:#404764}
[data-theme="guara"] .qb{background:#233829;color:#8fe0a8}

[data-theme="vermelho"] .qb{background:#4a2a2f;color:#ff9d9d}
[data-theme="vermelho"] .qb:hover{background:#5a343b}

/* Botões de categoria acima do catalogo - maiores e com tema */
.ti{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap;padding:12px 24px;border:0;border-radius:50px;background:#eceef5;color:#3d4465;font-family:'Segoe UI',Tahoma,sans-serif;font-size:1.05rem;font-weight:800;line-height:1;cursor:pointer;text-transform:none;letter-spacing:.2px;box-shadow:0 2px 6px rgba(61,68,101,.10);min-height:52px;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,color .18s ease}
.ti i{font-size:1.1rem;color:var(--accent-color,#ffb822);transition:color .18s ease}
.ti:hover{background:var(--primary-color,#3d4465);color:#fff;transform:translateY(-3px);box-shadow:0 8px 18px rgba(61,68,101,.28)}
.ti:hover i{color:var(--accent-color,#ffb822)}
.ti.on{background:linear-gradient(135deg,var(--primary-color,#3d4465) 0%,var(--secondary-color,#646c9a) 100%);color:#fff;transform:translateY(-3px);box-shadow:0 10px 22px rgba(61,68,101,.34)}
.ti.on i{color:var(--accent-color,#ffb822)}
.ti .cn{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:13px;font-size:.78rem;font-weight:700;color:#3d4465;background:#fff;margin-left:6px}
.ti .cn.on{background:#ffb822;color:#1a1a2e}

/* Temas categoria botoes acima do catalogo */
[data-theme="guara"] .ti{background:#e3f3e6!important;color:#1b7f3b!important}
[data-theme="guara"] .ti:hover{background:#1b7f3b!important;color:#fff!important}

<script>
/* ============================================
   PERFIL: numeros reais + tabela de pedidos
   (o formulario e preenchido pelo Conta.aplicarEmTodos)
   ============================================ */
(function() {
    if (typeof Conta !== "undefined") Conta.aplicarEmTodos();
})();

/* ============================================
   PERFIL = SO DADOS PESSOAIS E CONTATO
   Os numeros (pedidos, itens, total gasto) e a
   lista completa dos pedidos ficam na pagina Historico.
   ============================================ */
document.addEventListener("DOMContentLoaded", function () {
    if (typeof Conta !== "undefined") Conta.aplicarEmTodos();
});
if (document.readyState !== "loading" && typeof Conta !== "undefined") Conta.aplicarEmTodos();
function mostrarMsgSalvo(texto) {
    var msg = document.getElementById("msgSalvo");
    if (!msg) return;
    msg.innerHTML = '<i class="fa fa-check-circle"></i> ' + texto;
    msg.style.display = "block";
    clearTimeout(mostrarMsgSalvo._t);
    mostrarMsgSalvo._t = setTimeout(function () { msg.style.display = "none"; }, 4000);
}

function salvarPerfil() {
    var cpfVal = (document.getElementById("pCpf") || {}).value || "";
    cpfVal = cpfVal.replace(/\D/g, "");
    if (cpfVal && !cpfValido(cpfVal)) {
        alert("CPF inválido. Confira os números e tente novamente.");
        document.getElementById("pCpf").focus();
        return;
    }
    var f = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; };

    var dados = {
        nome: f("pNome"), tel: f("pTel"), email: f("pEmail"),
        endereco: f("pEndereco"), bairro: f("pBairro"), complemento: f("pComplemento"),
        numero: f("pNumero"), rua: f("pRua"), cep: f("pCep"), observacao: f("pObs"),
        cpf: cpfVal
    };

    if (!nomeValido(dados.nome)) {
        alert("Informe seu nome completo (nome e sobrenome, apenas letras).");
        document.getElementById("pNome").focus();
        return;
    }
    var telDigitos = dados.tel.replace(/\D/g, "");
    if (telDigitos.length < 10 || telDigitos.length > 11) {
        alert("Informe um WhatsApp válido com DDD. Exemplo: (21) 99999-9999.");
        document.getElementById("pTel").focus();
        return;
    }
    if (dados.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(dados.email)) {
        alert("E-mail inválido. Verifique o endereço digitado.");
        document.getElementById("pEmail").focus();
        return;
    }

    var resumo = "Nome: " + dados.nome + "\n"
               + "WhatsApp: " + dados.tel + "\n"
               + "CPF: " + (cpfVal ? cpfVal.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : "não informado") + "\n"
               + (dados.email ? "E-mail: " + dados.email + "\n" : "")
               + (dados.endereco ? "Endereço: " + dados.endereco + "\n" : "")
               + (dados.bairro ? "Bairro: " + dados.bairro : "");

    if (!confirm("Confirmar as alterações?\n\n" + resumo + "\n\nOs dados ficam salvos neste aparelho.")) return;

    Conta.salvar(dados);
    Conta.aplicarEmTodos();
    mostrarMsgSalvo("Dados salvos com sucesso!");
}
</script>
