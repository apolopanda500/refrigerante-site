<head>

<style>
.page { padding: 26px 0 60px; background: transparent; min-height: 100vh; }
.page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
.page-head h1 { color: var(--primary-color); font-size:1.8rem; display:flex; align-items:center; gap:10px; }
.cart-box { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:18px; }
.cart-item { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid #eee; flex-wrap:wrap; }
.cart-item:last-child { border-bottom:none; }
.cart-item img { width:64px; height:64px; object-fit:contain; border-radius:10px; background:#fafafa; display:block; }
.ci-info { flex:1; min-width:160px; }
.ci-name { font-weight:700; color:var(--text-color); display:block; }
.ci-price { color:#5f6570; font-size:0.9rem; }
.ci-qtd { display:inline-flex; align-items:center; gap:8px; border:1px solid #ddd; border-radius:22px; padding:5px 8px; background:#fafafa; }
.ci-qtd button { width:38px; height:38px; border:none; border-radius:50%; background:var(--primary-color); color:#fff; font-size:1.25rem; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.ci-qtd button:active { transform:scale(.94); }
.ci-qtd button:focus-visible { outline:3px solid var(--accent-color,#ffb822); outline-offset:2px; }
.ci-qtd span { min-width:30px; text-align:center; font-weight:bold; font-size:1.05rem; }
.ci-subtotal { font-weight:bold; color:var(--primary-color); min-width:90px; text-align:right; }
.ci-remove { background:none; border:none; color:var(--texto-erro); font-size:1.1rem; cursor:pointer; padding:6px; }
.cart-vazio { text-align:center; padding:50px 20px; color:#6b7280; }
.cart-vazio i { font-size:3rem; color:#ddd; margin-bottom:14px; }
.resumo { background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:18px; margin-top:20px; }
.resumo-row { display:flex; justify-content:space-between; padding:8px 0; font-size:1rem; }
.resumo-row.total { border-top:2px solid #eee; margin-top:8px; padding-top:14px; font-size:1.3rem; font-weight:bold; color:var(--primary-color); }
.acoes { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
.btn { flex:1; min-width:180px; text-align:center; padding:14px 20px; border:none; border-radius:26px; font-weight:bold; font-size:1rem; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primario { background:var(--primary-color); color:#fff; }
.btn-primario:hover { background:#c62828; }
.btn-secundario { background:#fff; color:var(--primary-color); border:2px solid var(--primary-color); }
.btn-secundario:hover { background:#fff3f3; }

/* ===== ALVO DE TOQUE MINIMO 44px (celular) ===== */
.qb,.qa,.btn-mini,.op-btn,.filtro,.btn,.btn-primario,.btn-secundario,.btn-enviar,.btn-salvar,.btn-detalhe,.btn-sair{
    min-height:44px;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

/* ===== quantidade: maior e facil de apertar ===== */
.qc{display:flex;border:2px solid #e0e0e0;border-radius:9px;overflow:hidden;flex:1;max-width:150px}
.qb{width:42px;height:42px;min-height:42px;font-size:1.25rem;line-height:1;
    display:flex;align-items:center;justify-content:center}
.qv{width:44px;min-height:42px;line-height:42px;font-size:1.1rem;text-align:center}
.qa{flex:1;min-height:42px;font-size:.88rem;font-weight:800;letter-spacing:.2px}

/* ===== no celular: quantidade e adicionar lado a lado, maiores ===== */
@media(max-width:560px){
    .qr{flex-wrap:wrap;gap:10px;padding:10px 12px 14px}
    .qc{flex:1 1 100%;max-width:none;height:50px}
    .qb{height:50px;width:50px;min-height:50px;font-size:1.4rem}
    .qv{flex:1;min-height:50px;line-height:50px;font-size:1.2rem;width:auto}
    .qa{flex:1 1 100%;min-height:50px;font-size:.95rem}
    .filtro{min-height:44px;padding:11px 18px;font-size:.92rem}
    .op-btn{min-height:46px;font-size:.9rem;padding:12px 10px}
    .btn-detalhe{min-height:44px;padding:11px 14px}
}

/* ===== item do carrinho no celular ===== */
@media(max-width:560px){
    .cart-item{gap:11px;padding:14px 0}
    .cart-item img{width:54px;height:54px;flex:0 0 54px}
    .ci-info{flex:1 1 100%;min-width:0}
    .ci-name{font-size:.98rem;line-height:1.35}
    .ci-price{font-size:.86rem}
    .ci-subtotal{min-width:auto;font-size:1.1rem;order:3}
    .ci-remove{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
    /* + e - bem grandes, com folga entre eles */
    .ci-qtd{gap:12px;padding:6px 10px;border-radius:26px}
    .ci-qtd button{width:46px;height:46px;font-size:1.45rem}
    .ci-qtd span{font-size:1.2rem;min-width:34px}
}

/* ===== barra de acoes fixa no celular ===== */
@media(max-width:560px){
    .acoes{position:fixed;left:0;right:0;bottom:0;z-index:150;
        padding:10px 12px calc(10px + env(safe-area-inset-bottom));
        background:#fff;border-top:1px solid #eee;
        box-shadow:0 -4px 16px rgba(0,0,0,.1);gap:8px;margin:0}
    .acoes .btn{min-width:0;flex:1;padding:13px 6px;font-size:.82rem;border-radius:12px;gap:4px}
    .page{padding-bottom:104px !important}
}
/* ===== botao de limpar: dentro da barra de acoes (sempre visivel,
   tanto com o carrinho cheio quanto vazio) ===== */
.btn-limpar-item{
    background:#fff;color:var(--texto-erro);border:2px solid #f3c9c9;
    font-weight:700;
}
.btn-limpar-item:hover{background:#c62828;border-color:var(--texto-erro);color:#fff}
[data-theme="dark"] .btn-limpar-item{background:#2a1a1c;color:#ff8a8a;border-color:#5a2a2e}
[data-theme="dark"] .btn-limpar-item:hover{background:#c62828;color:#fff}
.btn-limpar-item i{margin-right:6px}

/* ===== aviso de frete: usa o estilo global em style.css ===== */

/* ===== regioes e dias no carrinho ===== */
.vend-dia{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:9px 0;border-bottom:1px dashed var(--borda);
}
.vend-dia:last-child{border-bottom:0}
.vend-dia .dia-nome{font-size:.92rem;font-weight:700;color:var(--primary-color)}
.vend-dia .reg-dias{font-size:.82rem;color:var(--text-muted);text-align:right}
.vend-dia .reg-dias b{color:var(--texto-ok)}
[data-theme="dark"] .vend-dia{border-bottom-color:#353a5c}
[data-theme="dark"] .vend-dia .dia-nome{color:#ffb822}
[data-theme="dark"] .vend-dia .reg-dias{color:#a1a8c3}
[data-theme="dark"] .vend-dia .reg-dias b{color:#8fe0a8}

/* ===== regioes no carrinho: uma linha por bairro, sem estourar a caixa ===== */
.reg-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.reg-lista .vend-dia{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:10px 12px;border:1px solid var(--borda,#eeeef4);border-radius:12px;background:var(--bg-alt,#f7f7f7);
}
.reg-lista .vend-dia .dia-nome{font-weight:800;color:var(--text-color);display:inline-flex;align-items:center;gap:7px}
.reg-lista .vend-dia .reg-dias{font-size:.86rem;color:#5f6570;text-align:right;flex:1 1 auto;min-width:0}
.reg-lista .vend-dia.hoje{border-color:var(--primary-color,#3d4465)}
.tag-hoje{background:var(--accent-color,#ffb822);color:#3d4465;border-radius:9px;
 padding:2px 8px;font-size:.68rem;font-weight:800;letter-spacing:.04em;white-space:nowrap}
[data-theme="dark"] .reg-lista .vend-dia{background:#232742;border-color:#353a5c}
[data-theme="dark"] .reg-lista .vend-dia .reg-dias{color:#a1a8c3}

/* foto do produto: sempre visivel, mesmo sem imagem no catalogo */
.cart-item img{background:var(--bg-alt,#f7f7f7);object-fit:contain;padding:2px}

<script>
cart = getCart();

function renderCarrinho() {
    const box = document.getElementById("cartBox");
    const res = document.getElementById("resumoBox");
    const btn = document.getElementById("btnCheckout");
    updateCartCount();

    if (cart.length === 0) {
        box.innerHTML = '<div class="cart-vazio"><i class="fa fa-shopping-cart"></i><p>Seu carrinho est&aacute; vazio.</p></div>';
        res.innerHTML = "";
        btn.style.display = "none";
        return;
    }
    btn.style.display = "";

    /* ---------- preco SEMPRE o do catalogo ----------
       o item guardado no navegador pode estar velho (ex.: preco antigo).
       buscamos o preco atual pelo nome para o carrinho nunca mostrar
       um valor diferente do que o cliente ve na home. */
    const catalogo = (typeof PD !== "undefined" && PD.length) ? PD : [];
    function precoAtual(item) {
        let atual = null;
        for (let i = 0; i < catalogo.length; i++) {
            if (catalogo[i].nm === item.name) { atual = catalogo[i]; break; }
        }
        if (atual) {
            item.price = atual.pr;
            item.priceNum = precoNumero(atual.pr);
            item.img = atual.im || item.img;
        } else if (item.priceNum === undefined) {
            item.priceNum = precoNumero(item.price);
        }
        return arredonda(item.priceNum);
    }

    let html = "";
    cart.forEach(function(item, idx) {
        const unit = precoAtual(item);
        const qtd = (typeof item.qty === 'number' && item.qty > 0) ? item.qty : 1;
        const sub = arredonda(unit * qtd);
        html += '<div class="cart-item" data-idx="' + idx + '">'
            + '<img src="' + (item.img || "img/icon-192.png") + '" alt="' + item.name + '" loading="lazy"'
            + ' onerror="this.style.opacity=\'0.4\';this.style.background=\'#fafafa\'">'
            + '<div class="ci-info"><span class="ci-name">' + item.name + '</span>'
            + '<span class="ci-price">' + formatBRL(unit) + ' &times; ' + qtd + ' = <b>' + formatBRL(sub) + '</b></span></div>'
            /* editar quantidade: sempre visivel, com botao grande */
            + '<div class="ci-qtd" title="Mudar a quantidade">'
            + '<button onclick="mudarQtdCarrinho(' + idx + ',-1)" aria-label="Menos um">&minus;</button>'
            + '<span>' + qtd + '</span>'
            + '<button onclick="mudarQtdCarrinho(' + idx + ',1)" aria-label="Mais um">+</button></div>'
            + '<span class="ci-subtotal">' + formatBRL(sub) + '</span>'
            /* editar o item antes de finalizar */
            + '<div class="ci-editar">'
            + '<button class="ci-edit-btn" onclick="editarItemCarrinho(' + idx + ')"><i class="fa fa-pen"></i> Editar</button>'
            + '<button class="ci-remove" onclick="removerItem(' + idx + ')" title="Remover do carrinho" aria-label="Remover"><i class="fa fa-trash"></i></button>'
            + '</div>'
            + '</div>';
    });
    box.innerHTML = html;
    saveCart();

    const subtotal = arredonda(calcSubtotal());
    const nItens = calcTotalItens();

    /* ---- regiao escolhida: define o frete e o total final ---- */
    const regiao = (typeof regiaoCarrinho === "function") ? regiaoCarrinho() : null;
    const calc = (typeof calcularFrete === "function")
        ? calcularFrete(subtotal, regiao ? regiao.id : null)
        : { subtotal: subtotal, frete: 0, total: subtotal, gratis: false };
    const minimo = (typeof freteGratisMinimo === "function") ? freteGratisMinimo() : 150;

    /* aviso do frete: sempre com o mesmo visual */
    let aviso;
    if (subtotal <= 0) {
        aviso = "";
    } else if (calc.gratis) {
        aviso = '<div class="aviso aviso-ok"><i class="fa fa-check-circle"></i>'
              + ' <span><b>Frete GRÁTIS!</b> Seu pedido passou de ' + formatBRL(minimo) + '.</span></div>';
    } else {
        aviso = '<div class="aviso aviso-info"><i class="fa fa-truck"></i>'
              + ' <span>Faltam <b>' + formatBRL(arredonda(minimo - subtotal))
              + '</b> para o frete ficar <b>GRÁTIS</b>.</span></div>';
    }

    /* total final: depende da regiao escolhida */
    const linhaFrete = regiao
        ? '<div class="resumo-row"><span>Frete (' + regiao.nome + ')</span><span>'
          + (calc.gratis ? '<b class="txt-ok">GRÁTIS</b>' : formatBRL(calc.frete)) + '</span></div>'
        : '<div class="resumo-row"><span>Frete</span><span class="muted">escolha a região acima</span></div>';

    const semAviso = !regiao
        ? '<div class="aviso aviso-atencao"><i class="fa fa-circle-exclamation"></i>'
          + ' <span>Escolha a <b>região</b> e digite seu <b>bairro</b> para ver o valor final e o dia de entrega.</span></div>'
        : "";

    res.innerHTML = aviso + semAviso
        + '<div class="resumo-row"><span>Subtotal (' + nItens + (nItens === 1 ? ' item' : ' itens') + ')</span><span>' + formatBRL(subtotal) + '</span></div>'
        + linhaFrete
        + '<div class="resumo-row total"><span>Total final</span><span>' + formatBRL(calc.total) + '</span></div>';

    atualizarDiasCarrinho(regiao);
}

function mudarQtdCarrinho(idx, delta) {
    cart[idx].qty += delta;
    if (cart[idx].qty < 1) { cart.splice(idx, 1); }
    saveCart();
    renderCarrinho();
}
function removerItem(idx) {
    cart.splice(idx, 1);
    saveCart();
    renderCarrinho();
}

/* ===== EDITAR o item antes de finalizar =====
   abre uma caixa com o preco, a quantidade e os botoes.
   o cliente mexe o que quiser e so entao fecha. */
function editarItemCarrinho(idx) {
    const item = cart[idx];
    if (!item) return;
    const qtd = (typeof item.qty === "number" && item.qtd > 0) ? item.qty : (item.qty || 1);
    const unit = (typeof item.priceNum === "number") ? item.priceNum : precoNumero(item.price);
    const nome = String(item.name).replace(/[<>&]/g, "");

    const html = '<div class="ed-overlay" id="edOverlay">'
        + '<div class="ed-box" role="dialog" aria-modal="true">'
        + '  <div class="ed-cab"><i class="fa fa-pen"></i> Editar produto</div>'
        + '  <div class="ed-nome">' + nome + '</div>'
        + '  <div class="ed-preco">Pre&ccedil;o unit&aacute;rio: <b>' + formatBRL(unit) + '</b></div>'
        + '  <div class="ed-qtd">'
        + '    <button onclick="editarQtd(-1)" aria-label="Menos">&minus;</button>'
        + '    <span id="edQtd">' + qtd + '</span>'
        + '    <button onclick="editarQtd(1)" aria-label="Mais">+</button>'
        + '  </div>'
        + '  <div class="ed-total">Total do item: <b id="edTotal">' + formatBRL(arredonda(unit * qtd)) + '</b></div>'
        + '  <div class="ed-acoes">'
        + '    <button class="btn btn-secundario" onclick="fecharEdicao()">Cancelar</button>'
        + '    <button class="btn btn-vermelho" onclick="removerItemDaEdicao()"><i class="fa fa-trash"></i> Remover</button>'
        + '    <button class="btn btn-primario" onclick="salvarEdicao()"><i class="fa fa-check"></i> Salvar</button>'
        + '  </div>'
        + '</div></div>';

    const div = document.createElement("div");
    div.innerHTML = html;
    document.body.appendChild(div.firstChild);
    const novaQtd = { v: qtd, unit: unit, idx: idx };
    window._edicao = novaQtd;
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") fecharEdicao(); });
}

function editarQtd(delta) {
    const e = window._edicao;
    if (!e) return;
    e.v = Math.max(1, (e.v || 1) + delta);
    const q = document.getElementById("edQtd");
    const t = document.getElementById("edTotal");
    if (q) q.textContent = e.v;
    if (t) t.textContent = formatBRL(arredonda(e.unit * e.v));
}

function salvarEdicao() {
    const e = window._edicao;
    if (!e) return;
    cart[e.idx].qty = e.v;
    cart[e.idx].priceNum = e.unit;
    saveCart();
    fecharEdicao();
    renderCarrinho();
}

function removerItemDaEdicao() {
    const e = window._edicao;
    if (!e) return;
    cart.splice(e.idx, 1);
    saveCart();
    fecharEdicao();
    renderCarrinho();
}

function fecharEdicao() {
    const el = document.getElementById("edOverlay");
    if (el) el.remove();
    window._edicao = null;
}

renderCarrinho();
</script>

<script>
/* ===== confirma antes de limpar (funciona com carrinho cheio ou vazio) ===== */
function confirmarLimpar(){
    if (cart.length === 0) {
        alert("O carrinho já está vazio.");
        return;
    }
    var n = cart.length;
    var itens = cart.reduce(function (t, i) { return t + i.qty; }, 0);
    if (!confirm("Remover " + itens + " " + (itens === 1 ? "item" : "itens")
        + " (" + n + " " + (n === 1 ? "produto" : "produtos") + ") do carrinho?\n\nEsta ação não pode ser desfeita.")) return;
    limparCarrinho();
    if (typeof renderCarrinho === "function") renderCarrinho();
    alert("Carrinho esvaziado.");
}

/* ===== bairro e regiao: escolhidos aqui, usados no checkout ===== */
const K_BAIRRO = "carrinhoBairro";
const K_REGIAO = "carrinhoRegiao";

function regiaoCarrinho() {
    const sel = document.getElementById("regiaoCarrinho");
    if (!sel || typeof REGIOES === "undefined") return null;
    const id = sel.value;
    let achada = null;
    REGIOES.forEach(function (r) { if (r.id === id) achada = r; });
    return achada;
}

function bairroCarrinho() {
    const inp = document.getElementById("bairroCarrinho");
    return inp ? inp.value.trim() : "";
}

/* guarda em 2 lugares: o checkout e o perfil leem do mesmo sitio */
function salvarBairroRegiao() {
    const b = bairroCarrinho(), r = regiaoCarrinho();
    try {
        if (b) localStorage.setItem(K_BAIRRO, b); else localStorage.removeItem(K_BAIRRO);
        localStorage.setItem(K_REGIAO, r ? r.id : "");
    } catch (e) { }
    /* a conta do cliente tambem guarda (o checkout usa) */
    try {
        if (typeof Conta !== "undefined" && Conta.dados) {
            const d = Conta.dados();
            if (b && d.bairro !== b) Conta.salvar({ bairro: b });
        }
    } catch (e) { }
}

/* monta o <select> e ja deixa o que estava salvo */
function montarSeletorBairro() {
    const sel = document.getElementById("regiaoCarrinho");
    const inp = document.getElementById("bairroCarrinho");
    if (!sel || typeof REGIOES === "undefined") return;

    let salvo = "";
    try { salvo = localStorage.getItem(K_REGIAO) || ""; } catch (e) { }
    /* se o cliente ja tem bairro no perfil, usa como bairro */
    let bairroSalvo = "";
    try { bairroSalvo = localStorage.getItem(K_BAIRRO) || ""; } catch (e) { }
    if (!bairroSalvo) {
        try { bairroSalvo = (typeof Conta !== "undefined" && Conta.dados) ? (Conta.dados().bairro || "") : ""; } catch (e) { }
    }
    /* se nao escolheu regiao antes, escolhe a do proprio bairro */
    if (!salvo) {
        try {
            REGIOES.forEach(function (r) {
                if (!salvo && (r.regioes || []).length) { /* nada a fazer aqui */ }
            });
            const peloNome = REGIOES.find(function (r) {
                const b = semAcento(bairroSalvo);
                return b && (semAcento(r.nome).indexOf(b) >= 0 || b.indexOf(semAcento(r.nome)) >= 0);
            });
            if (peloNome) salvo = peloNome.id;
        } catch (e) { }
    }

    sel.innerHTML = '<option value="">Escolha a regiao...</option>'
        + REGIOES.map(function (r) {
            return '<option value="' + r.id + '"' + (salvo === r.id ? " selected" : "") + '>'
                 + r.nome + ' - entrega ' + r.diasTexto + '</option>';
        }).join("");

    if (inp) inp.value = bairroSalvo;

    sel.addEventListener("change", function () { salvarBairroRegiao(); renderCarrinho(); });
    if (inp) {
        inp.addEventListener("change", function () {
            salvarBairroRegiao();
            atualizarAvisoCarrinho();
        });
    }
}

/* mostra os dias de pedido e de entrega da regiao escolhida */
function atualizarDiasCarrinho(r) {
    const el = document.getElementById("diasCarrinho");
    if (!el) return;
    if (!r) { el.innerHTML = ""; return; }
    const hoje = (typeof diaDeHoje === "function") ? diaDeHoje() : new Date().getDay();
    const entregaHoje = r.dias.indexOf(hoje) >= 0;
    const abre = (typeof pedidoAbreHoje === "function") ? pedidoAbreHoje(r) : false;

    let classe = "aviso-info", icone = "fa fa-calendar-alt", texto;
    if (entregaHoje) {
        classe = "aviso-ok"; icone = "fa fa-truck";
        texto = "<b>Hoje entregamos em " + r.nome + "</b>, das " + r.horario + ".";
    } else if (abre) {
        classe = "aviso-pedido"; icone = "fa fa-cart-plus";
        texto = "<b>Hoje os pedidos de " + r.nome + " estão abertos.</b> A entrega sai " + r.diasTexto.toLowerCase() + ".";
    } else {
        classe = "aviso-atencao"; icone = "fa fa-clock";
        texto = "Pedidos de <b>" + r.nome + "</b> na " + (typeof textoDiasPedido === "function" ? textoDiasPedido(r) : "-")
              + ". Entrega " + r.diasTexto.toLowerCase() + ", das " + r.horario + ".";
    }
    el.innerHTML = '<div class="aviso ' + classe + '"><i class="' + icone + '"></i> <span>' + texto + '</span></div>';
}

/* ===== regiao e dia de entrega no carrinho (simples, sem repetir) ===== */
function pintarRegiaoCarrinho(){
    var el = document.getElementById("infoRegiao");
    if (!el || typeof REGIOES === "undefined") return;
    var d = new Date().getDay();
    var h = '<div class="cl-tx" style="color:var(--text-color)"><b><i class="fa fa-truck"></i> Sua entrega</b>'
          + '</div>';
    var linhas = "";
    REGIOES.forEach(function (r) {
        var hoje = r.dias.indexOf(d) >= 0;
        linhas += '<div class="vend-dia' + (hoje ? " hoje" : "") + '">'
                + '<span class="dia-nome">' + r.nome + (hoje ? ' <span class="tag-hoje">HOJE</span>' : '') + '</span>'
                + '<span class="reg-dias">' + r.diasTexto + '</span></div>';
    });
    el.innerHTML = '<div class="cl-tx" style="color:var(--text-color);margin-bottom:8px">'
        + '<b><i class="fa fa-map-marker-alt"></i> Regioes de atendimento</b>'
        + '<span style="display:block;font-weight:500;color:#5f6570;margin-top:2px">'
        + 'Cada bairro tem dias proprios de entrega.</span></div>'
        + '<div class="reg-lista">' + linhas + '</div>';
}

/* ===== regra de atendimento: horario + bairro ===== */
function atualizarAvisoCarrinho(){
    if (typeof pedidosLiberados !== "function") return;
    var box = document.getElementById("avisoAtendimento");
    var btn = document.getElementById("btnCheckout");
    if (!box) return;
    var bairro = "";
    try { bairro = (typeof Conta !== "undefined") ? (Conta.dados().bairro || "") : ""; } catch(e) {}
    var regra = pedidosLiberados("");
    var fora = (typeof bairroForaDaArea === "function") && bairroForaDaArea(bairro);
    var btnMostrar = function () { if (btn) btn.style.display = ""; };

    /* fora do horario: pausa */
    if (!regra.liberado) {
        box.className = "regra-atendimento" + ((!regra.liberado) ? " fechado" : "");
        box.style.display = "flex";
        box.innerHTML = '<i class="fa fa-pause-circle"></i> <span><b>Pedidos pausados.</b> ' + regra.texto
            + ' Atendemos das <b>08:50</b> às <b>15:00</b>.</span>';
        if (btn) btn.style.display = "none";
        return;
    }
    /* bairro fora da area: avisa aqui; o checkout bloqueia o envio */
    if (fora) {
        box.className = "regra-atendimento";
        box.style.display = "flex";
        box.innerHTML = '<i class="fa fa-map-marker-alt"></i> <span><b>Atenção:</b> o bairro "' + bairro
            + '" não está na nossa lista de entregas (' + BAIRROS_ATENDIDOS_TEXTO
            + '). O pedido será bloqueado na finalização: corrija o bairro no perfil.</span>';
        btnMostrar();
        return;
    }
    box.style.display = "none";
    box.innerHTML = "";
    btnMostrar();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", atualizarAvisoCarrinho);
else atualizarAvisoCarrinho();
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", pintarRegiaoCarrinho);
else pintarRegiaoCarrinho();

/* monta o seletor de bairro/regiao e ja calcula o total final */
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () {
    montarSeletorBairro();
    renderCarrinho();
});
else { montarSeletorBairro(); renderCarrinho(); }

</script>
